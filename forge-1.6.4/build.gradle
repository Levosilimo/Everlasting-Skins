// forge-1.6.4 — standalone vendored-deobf build for the Minecraft 1.6.4 lane.
//
// LANE SEPARATION (out-of-band, per monorepo doctrine): this lane cannot use
// any ForgeGradle. fix-3 (2026-08-08) verified empirically that GTNH FG
// 1.2.11 rejects forge 9.11.1.1345 at configuration time, MCP-Archive has
// zero 1.6.4 channels, and de.oceanlabs.mcp:mcp:1.6.4 404s on the Forge
// maven. So the lane toolchain IS the vendored remap harness proven by the
// 0.5-day SpecialSource spike (feature/lane-forge-1.6.4-vendored-spike,
// 3d30c29): remap-only (SpecialSource 1.7.4 bytecode remapping against the
// MCP 8.11 conf bundled in the forge src zip), no decompiler, no FG, no
// jitpack, no archive.org. This build is its own wrapper (Gradle 4.4.1,
// Java 8 ONLY), never included in settings.gradle.kts, no buildSrc, no
// `everlastingskins.forge-module` convention, no dependency-analysis
// (out-of-band policy, same as forge-1.7.10 / forge-1.8.9 / mc1.12.2).
//
// The vendored SpecialSource harness itself lives ONCE in
// ../harness/specialsource-harness.gradle (lib-12 Option B graduation) and
// is consumed via `apply from:` below (in-repo precedent:
// mc1.12.2/build.gradle:166). This file carries only the per-lane
// harnessConfig (vendoredInputs, mcpVersion, mergeOrder, subclassExpansion,
// nameDomainTokens, testRuntimeDeps) and the lane-specific prose below.
//
// NAME DOMAINS (empirical, spike-verified against the piston server jar):
//   - production runtime = OBFUSCATED. minecraft_server.1.6.4.jar ships
//     proguard names: root-package classes (`ea`, `ey`, ...) EXCEPT identity
//     classes like net/minecraft/server/MinecraftServer which keep their
//     names; members are always obf (MinecraftServer.F(), Packet250CustomPayload
//     field `a`). FMLDeobfTweaker registers an empty remapper in production
//     (identity), so the shipped mod jar MUST be reobfuscated to this domain.
//   - MCP 8.11 conf (bundled in forge-1.6.4-9.11.1.1345-src.zip at
//     forge/fml/conf/, version.cfg asserts MCPVersion=8.11): joined.srg CL
//     lines map obf-class -> srg-class (net/minecraft/src/*); MD lines key by
//     (obf-owner, obf-method, OBF-desc) and carry per-side #C/#S variants;
//     FD lines key by (obf-owner, obf-field). methods.csv/fields.csv map
//     func_/field_ -> readable deobf names.
//   - 1.6.4 universal naming quirk: the compiled FML 7.x + Forge artifact is
//     universal.JAR (the reverse of 1.5.2/1.4.7, where universal.zip is live
//     and universal.jar 404s). It is obf-domain for classes and fields,
//     READABLE for methods (spike javap of the RAW jar: `Method
//     ka.sendPacketToPlayer`, `Field jv.a`); the single obf->deobf leg with
//     an empty-CL fallback handles it. It carries NO patched MC classes, so
//     the merge order is irrelevant here (mergeOrder=serverFirst; the two
//     jars are disjoint by construction).
//   - dev classpath = build/deobf/merged-deobf.jar (server.jar obf->deobf +
//     universal.jar obf->deobf, merged). Ship artifact = the mod jar
//     reobf'd deobf->obf (composite: csv reverse + joined.srg reverse).

plugins {
    id 'java'
}

ext {
    harnessConfig = [
        // Vendored inputs (resolveVendored): forge src zip (bundles the MCP
        // 8.11 conf), forge universal jar, vanilla 1.6.4 server jar.
        vendoredInputs: [
            [name: 'forge-1.6.4-9.11.1.1345-src.zip',
             url: 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.6.4-9.11.1.1345/forge-1.6.4-9.11.1.1345-src.zip',
             algo: 'MD5', digest: 'ba1b7de42be281e9db98f7cc7064e672'],
            [name: 'forge-1.6.4-9.11.1.1345-universal.jar',
             url: 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.6.4-9.11.1.1345/forge-1.6.4-9.11.1.1345-universal.jar',
             algo: 'MD5', digest: 'a4d84569831a19d562b690343634cbac'],
            [name: 'minecraft_server.1.6.4.jar',
             url: 'https://piston-data.mojang.com/v1/objects/050f93c1f3fe9e2052398f7bd6aca10c63d64a87/server.jar',
             algo: 'SHA-1', digest: '050f93c1f3fe9e2052398f7bd6aca10c63d64a87'],
        ],
        mcpVersion: '8.11',
        archiveBaseName: 'everlastingskins-1.6.4',
        mergeOrder: 'serverFirst',     // fork #1: 1.6.4 universal has NO patched MC classes (jars disjoint)
        subclassExpansion: true,       // fork #2: PR #374 backport (javac receiver-owner reobf fix)
        nameDomainTokens: [            // fork #3: assertNameDomain forbidden set
            'func_', 'field_', 'net/minecraft/src/',
            'net/minecraft/server/MinecraftServer.getServer',
            'Packet250CustomPayload.channel',
            'getCommandSenderName',
            'getConfigurationManager',
            'net/minecraft/server/MinecraftServer.getFile',
            'playerNetServerHandler',
            'netManager',
            'playerEntityList',
        ],
        // fork #4: test-runtime log4j-core match for log4j-api 2.8.1
        // (authlib 1.5.16 transitively pulls log4j-core:2.0-beta9, whose
        // Log4jContextFactory mismatches — AbstractMethodError at test
        // runtime; backported from the 1.5.2 lane fix, commit 04c18ee).
        testRuntimeDeps: ['org.apache.logging.log4j:log4j-core:2.8.1'],
    ]
}

apply from: '../harness/specialsource-harness.gradle'

// ---------------------------------------------------------------------------
// RUNTIME-COMPAT FIX (slice-1 E2E discovery): FML 7.x reads mod-jar classes
// with its bundled ASM 4.x, which refuses class files above major version 51
// (Java 7). A Java-8-targeted jar is therefore rejected wholesale at boot
// ("Zip file ... failed to read properly, it will be ignored" — observed
// live 2026-08-10 against forge-1.6.4-9.11.1.1345). The mod must compile
// against Java 8 APIs (javac 8 forbids source-8 → target-7, and :common uses
// lambdas/streams), so the shipped jar's class files are downgraded to major
// 51 in place AFTER reobf. The production 1.6.4 runtime (like the E2E) is
// Java 8, so the bytecode — including invokedynamic for :common lambdas —
// executes unchanged; only the version stamp changes.
// ---------------------------------------------------------------------------
task downgradeClassVersion(dependsOn: reobf) {
    group = 'everlastingskins'
    description = 'Rewrite class-file major version 52 -> 51 in the reobf\'d jar (FML 7.x ASM cannot read Java 8 class files).'
    inputs.file jar.archivePath
    outputs.file jar.archivePath
    doLast {
        def jarFile = jar.archivePath
        def tmp = file("${jarFile}.v51")
        def zin = new java.util.zip.ZipFile(jarFile)
        int downgraded = 0
        def zout = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tmp)))
        try {
            zin.entries().each { entry ->
                if (entry.isDirectory()) {
                    zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    zout.closeEntry()
                    return
                }
                def bytes = zin.getInputStream(entry).bytes
                if (entry.name.endsWith('.class') && bytes.length > 8) {
                    int major = ((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF)
                    if (major > 51) {
                        bytes[6] = 0
                        bytes[7] = 51
                        downgraded++
                    }
                }
                zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                zout.write(bytes)
                zout.closeEntry()
            }
        } finally {
            zout.close()
            zin.close()
        }
        if (!jarFile.delete()) throw new GradleException("downgradeClassVersion: could not delete ${jarFile}")
        if (!tmp.renameTo(jarFile)) throw new GradleException("downgradeClassVersion: could not replace ${jarFile}")
        logger.lifecycle("downgradeClassVersion: ${downgraded} class files rewritten to major 51 (Java 7) in ${jarFile.name}")
    }
}
// The name-domain self-check javap's the jar — must see the final artifact.
assertNameDomain.dependsOn downgradeClassVersion

// E2E slice 1: the shared sentinel PNG (:common test resources, canonical at
// common/src/test/resources/e2e/sentinel-64x32.png) is mirrored onto the
// lane's test resources (same pattern as the main source-dir share). The
// e2e scripts read the canonical copy straight from the repo path; the
// classpath copy lets the lane's tests assert the pixel contract of the
// exact bytes the live run injects.
sourceSets {
    test {
        resources {
            srcDir '../common/src/test/resources'
        }
    }
}
