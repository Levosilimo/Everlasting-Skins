buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url 'https://plugins.gradle.org/m2/' }
        maven {
            
            name 'Sponge / Mixin Maven'
            url 'https://repo.spongepowered.org/repository/maven-public/'
        }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.+'
        classpath 'org.apache.httpcomponents:httpclient:4.5.13'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

repositories {
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
}

version = "${mod_version}"
archivesBaseName = "${mod_name}-${minecraft_version}"
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'



minecraft {

    mappings channel: 'official', version: "${minecraft_version}".toString()

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
	
    runs {

        client {

            workingDirectory project.file('run')
            taskName "${mod_name}".replaceAll("\\s","") + 'Client'
            property 'forge.logging.console.level', 'debug'
            property 'terminal.ansi', 'true'
            arg "-mixin.config=" + project.findProperty('mixin_id') + ".mixins.json"
            jvmArg "-Dmixin.env.disableRefMap=true"

            mods {
                enchdesc {
                    source sourceSets.main
                }
            }
        }

        server {

            workingDirectory project.file('run')
            taskName "${mod_name}".replaceAll("\\s","") + 'Server'
            property 'forge.logging.console.level', 'debug'
            property 'terminal.ansi', 'true'
            arg "-mixin.config=" + project.findProperty('mixin_id') + ".mixins.json"
            jvmArg "-Dmixin.env.disableRefMap=true"

            mods {
                enchdesc {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "everlastingskins.refmap.json"
    config 'everlastingskins.mixins.json'
}

dependencies {
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transitive dependencies request 6.0+
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

jar {
    duplicatesStrategy(DuplicatesStrategy.INCLUDE)
    manifest {
        attributes([
            'Timestamp': System.currentTimeMillis(),
            'Specification-Title': "${mod_name}",
            'Specification-Vendor': "${mod_vendor}",
            'Specification-Version': "${version}",
            'Implementation-Title': project.archivesBaseName,
            'Implementation-Version': project.version,
            'Implementation-Vendor' :"${mod_vendor}",
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'Built-On-Java': "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
            'Built-On': "${forge_version}",
            "TweakClass"              : 'org.spongepowered.asm.launch.MixinTweaker',
            "TweakOrder"              : 0,
            "MixinConfigs": "${mixin_id}.mixins.json"
        ])
    }
}



processResources {

}