buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url 'https://plugins.gradle.org/m2/' }
        maven {
            
            name 'Sponge / Mixin Maven'
            url 'https://repo.spongepowered.org/repository/maven-public/'
        }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.+'
        classpath 'org.apache.httpcomponents:httpclient:4.5.13'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.11'
}

repositories {
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net/"
    }
    maven {
        name = "DiscordSRV"
        url = "https://nexus.scarsz.me/content/groups/public/"
    }
    maven {
        name = "PlaceholderAPI"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        name = "Spigot"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "PaperMC"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    mavenCentral()
}

version = "${mod_version}"
archivesBaseName = "${mod_name}-${minecraft_version}"
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java {
    // withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}


// Game test source set: separate from unit tests because it compiles and runs
// against the real Minecraft server (game test framework), not JUnit.
// Declared before the runs block, which references it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}


minecraft {

    mappings channel: 'official', version: "${minecraft_version}".toString()
    reobf = false

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
	
    runs {

        configureEach {
            workingDirectory project.file(project.findProperty('mc.runDir') ?: 'run')
            property 'forge.logging.console.level', 'debug'
            property 'fml.earlyprogresswindow', 'false'
            property 'mixin.env.disableRefMap', 'true'

            mods {
                "everlastingskins" {
                    source sourceSets.main
                }
            }
        }

        client {
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"

            property 'forge.logging.markers', 'REGISTRYDUMP'
        }

        server {
            workingDirectory project.file('server')
            property 'mixin.env.disableRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        }

        client2 {
            parent runs.client
            taskName 'runClient2'
            workingDirectory project.file(project.findProperty('mc.runDir2') ?: 'run2')
            args '--username', 'PlayerB'
            args '--uuid', 'd1b05a3e-9909-3e16-95e5-7eef2d6c713b'
            mods {
                everlastingskins {
                    source sourceSets.main
                }
            }
        }

        // Forge ships a built-in gameTestServer run definition (launchTarget
        // forge_userdev_server_gametest); ForgeGradle names the task
        // runGameTestServer. The gametest source set must be part of the mod so
        // its @GameTestHolder classes are scanned and its structure templates
        // are loaded from the dev mod jar's datapack.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.findProperty('gametestNamespace') ?: 'everlastingskins'
            // Netty 4.1 needs reflective access into the JDK on Java 21
            // (GameTest job failed with "Reflective setAccessible(true)
            // disabled" / module exports). Applied to the forked GameTest
            // server JVM, not the Gradle daemon.
            jvmArgs(
                '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.nio=ALL-UNNAMED',
                '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
                '-Dio.netty.tryReflectionSetAccessible=true'
            )
            mods {
                everlastingskins {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "everlastingskins.refmap.json"
    config 'everlastingskins.mixins.json'
}

dependencies {
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transitive dependencies request 6.0+
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'com.discordsrv:discordsrv:1.30.5'

    // slf4j-api MUST appear before discordsrv in the classpath order.
    // discordsrv bundles unrelocated SLF4J 1.x classes (org/slf4j/LoggerFactory)
    // that lack the getProvider() method required by SLF4J 2.x. The declaration
    // order within testImplementation determines classpath ordering.
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'com.discordsrv:discordsrv:1.30.5'
    testImplementation 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'me.clip:placeholderapi:2.12.3'
    testImplementation 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'

    gametestImplementation sourceSets.main.output
    gametestImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'
    gametestRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

configurations.testRuntimeClasspath {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.slf4j') {
            details.useVersion '2.0.9'
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = false
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jar {
    duplicatesStrategy(DuplicatesStrategy.INCLUDE)
    manifest {
        attributes([
            'Timestamp': System.currentTimeMillis(),
            'Specification-Title': "${mod_name}",
            'Specification-Vendor': "${mod_vendor}",
            'Specification-Version': "${version}",
            'Implementation-Title': project.archivesBaseName,
            'Implementation-Version': project.version,
            'Implementation-Vendor' :"${mod_vendor}",
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'Built-On-Java': "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
            'Built-On': "${forge_version}",
            "TweakClass"              : 'org.spongepowered.asm.launch.MixinTweaker',
            "TweakOrder"              : 0,
            "MixinConfigs": "${mixin_id}.mixins.json"
        ])
    }
}



processResources {
    inputs.property "version", project.mod_version

}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
