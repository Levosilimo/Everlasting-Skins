buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://files.minecraftforge.net/maven' }
        maven { name = 'sonatype'; url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3.4'
    }
}

plugins {
    id 'java'
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.11'
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "${mod_version}"
group = 'levosilimo.everlastingskins'
archivesBaseName = 'everlastingskins-1.12.2'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = '1.12.2-14.23.5.2847'
    runDir = 'run'
    mappings = 'snapshot_20171003'
    replace '@VERSION@', project.version
}

// Gradle 4.10.3 has no per-srcDir filter closure (srcDir(Object, Closure) was added later),
// and a filtered fileTree in srcDirs breaks ForgeGradle 2.3.4's TaskSourceCopy fingerprinting
// ("Source directory ... is not a directory"). Stage a filtered copy of :common's test tree
// instead; the Sync output dir is a plain srcDir. FG already compiles all test sources from a
// copy (build/sources/test/java), so this matches the lane's existing compile pipeline.
task syncCommonTestSources(type: Sync) {
    from '../common/src/test/java'
    into "$buildDir/generated/common-test-sources"
    // Only the 8 divergent files (which stay lane-local in src/test/java) are excluded from
    // the SHARED tree; a global source-set exclude would also strip mc1.12.2's own copies.
    exclude 'levosilimo/everlastingskins/metrics/**'
    // TestConfigSupport is forge-lane-only (imports com.electronwill.nightconfig, not a
    // mc1.12.2 dependency); mc1.12.2 has no copy of its own (P2-3 scope).
    exclude 'levosilimo/everlastingskins/permission/TestConfigSupport.java'
    exclude 'levosilimo/everlastingskins/skinchanger/SkinIOPropertyTest.java'
    exclude 'levosilimo/everlastingskins/skinchanger/SkinIODeleteRaceTest.java'
    exclude 'levosilimo/everlastingskins/skinchanger/MojangApiFuzzTest.java'
    exclude 'levosilimo/everlastingskins/skinchanger/SkinStorageTest.java'
    exclude 'levosilimo/everlastingskins/skinchanger/SkinIOMetamorphicTest.java'
    exclude 'levosilimo/everlastingskins/skinchanger/DefaultSkinResolverTest.java'
    exclude 'levosilimo/everlastingskins/skinchanger/SkinStorageMetamorphicTest.java'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            // Share the monorepo :common sources (no JPMS on Java 8). Classes that
            // also exist here are deleted from src/main/java — common is canonical.
            srcDir '../common/src/main/java'
            // Exclude Mixin support files — no Mixin annotation processor configured for 1.12.2
            exclude 'levosilimo/everlastingskins/mixin/**'
        }
    }
    test {
        java {
            srcDir 'src/test/java'
            // Share the :common unit-test tree (Java 8, no JPMS). Files that are
            // byte-identical here are deleted from src/test/java — common is canonical.
            // srcDir(Task) adds the Sync output dir and wires the task dependency; the
            // excludes above apply only to the shared tree, never to src/test/java.
            srcDir tasks.syncCommonTestSources
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "PlaceholderAPI"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        name = "DiscordSRV"
        url = "https://nexus.scarsz.me/content/groups/public/"
    }
    maven {
        name = "Spigot"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
}

dependencies {
    // JetBrains annotations for @Nullable/@NotNull
    provided 'org.jetbrains:annotations:24.0.0'

    // LuckPerms soft-dependency (compile-only)
    provided 'net.luckperms:api:5.5'
    provided 'me.clip:placeholderapi:2.12.3'
    provided 'com.discordsrv:discordsrv:1.30.5'
    compile 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'

    // Apache HttpClient for HTTP transport
    compile 'org.apache.httpcomponents:httpclient:4.5.13'

    // JUnit 5 for test source set
    testCompile 'org.junit.jupiter:junit-jupiter-api:5.10.3'
    testCompile 'org.junit.jupiter:junit-jupiter-params:5.10.3'
    testCompile 'net.jqwik:jqwik:1.9.0'
    testCompile 'me.clip:placeholderapi:2.12.3'
    testCompile 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'
    testRuntime 'org.junit.jupiter:junit-jupiter-engine:5.10.3'
    testRuntime 'org.junit.platform:junit-platform-launcher:1.10.3'
    testCompile 'com.discordsrv:discordsrv:1.30.5'
    testCompile 'org.mockito:mockito-core:2.28.2'
}

test {
    useJUnitPlatform()
    // Prevent test task from failing if no tests are found (clean build)
    testLogging {
        events "passed", "skipped", "failed"
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.enabled = true
        html.enabled = true
    }
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': archivesBaseName,
            'Specification-Vendor': 'Levosilimo',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Levosilimo',
            'FMLAT': 'everlastingskins_at.cfg'
        ])
    }
}
