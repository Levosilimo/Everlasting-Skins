name: CI
on:
  push:
    branches: ["1.21", "mc1.12.2"]
jobs:
  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint -q && yamllint -d relaxed .github/workflows/build.yml .yamllint.yml
  build-1.21:
    name: java-21
    runs-on: ubuntu-latest
    needs: lint-yaml
    if: github.ref_name == '1.21' || github.base_ref == '1.21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-21-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-21-
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: es-21-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
  build-mc1.12.2:
    name: java-8
    runs-on: ubuntu-latest
    needs: lint-yaml
    if: github.ref_name == 'mc1.12.2' || github.base_ref == 'mc1.12.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-8-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-8-
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: es-8-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
  e2e-21:
    name: E2E 21
    runs-on: ubuntu-latest
    needs: build-1.21
    if: github.ref_name == '1.21' || github.base_ref == '1.21'
    steps:
      - run: echo "e2e 1.21 placeholder"
  e2e-8:
    name: E2E 8
    runs-on: ubuntu-latest
    needs: build-mc1.12.2
    if: github.ref_name == 'mc1.12.2' || github.base_ref == 'mc1.12.2'
    steps:
      - run: echo "e2e mc1.12.2 placeholder"
