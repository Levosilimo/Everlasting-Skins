name: CI
on:
  push:
    branches: ["1.21", "mc1.12.2"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "lint ok"
  build-a:
    name: Build A
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref_name == '1.21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: echo "build a ok"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-a-${{ github.sha }}
          path: .
          if-no-files-found: warn
  build-b:
    name: Build B
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref_name == 'nonexistent'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-b-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-b-
      - run: echo "build b ok"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-b-${{ github.sha }}
          path: .
          if-no-files-found: warn
  e2e-a:
    name: E2E A
    runs-on: ubuntu-latest
    needs: build-a
    if: github.ref_name == '1.21'
    env:
      SERVER_DIR: ${{ github.workspace }}/test-server
      HMC_DIR: ${{ github.workspace }}/HeadlessMC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: artifact-a-${{ github.sha }}
          path: ${{ github.workspace }}/build/
      - run: echo "e2e a running"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-a-${{ github.sha }}
          path: .
          if-no-files-found: warn
  e2e-b:
    name: E2E B
    runs-on: ubuntu-latest
    needs: build-b
    if: github.ref_name == 'nonexistent'
    env:
      SERVER_DIR: ${{ github.workspace }}/test-server
      HMC_DIR: ${{ github.workspace }}/HeadlessMC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: artifact-b-${{ github.sha }}
          path: ${{ github.workspace }}/build/
      - run: echo "e2e b running"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-b-${{ github.sha }}
          path: .
          if-no-files-found: warn
