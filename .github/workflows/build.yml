name: CI
on:
  push:
    branches: ["1.21", "mc1.12.2"]
  pull_request:
    branches: ["1.21", "mc1.12.2"]
jobs:
  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint -q && yamllint -d relaxed .github/workflows/build.yml .yamllint.yml
  build-1.21:
    name: java-21
    runs-on: ubuntu-latest
    needs: lint-yaml
    if: github.ref_name == '1.21' || github.base_ref == '1.21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-1.21-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-1.21-
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: es-skins-21-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
  build-mc1.12.2:
    name: java-8
    runs-on: ubuntu-latest
    needs: lint-yaml
    if: github.ref_name == 'mc1.12.2' || github.base_ref == 'mc1.12.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-8-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-8-
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: es-skins-8-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
  e2e-test-1.21:
    name: E2E java-21
    runs-on: ubuntu-latest
    needs: build-1.21
    if: github.ref_name == '1.21' || github.base_ref == '1.21'
    env:
      SD: ${{ github.workspace }}/test-server
      HD: ${{ github.workspace }}/HeadlessMC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - run: sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: es-skins-21-${{ github.sha }}
          path: ${{ github.workspace }}/build/
      - run: mkdir -p ${{ env.SD }}/mods ${{ env.SD }}/logs
      - run: cp ${{ github.workspace }}/build/libs/*.jar ${{ env.SD }}/mods/
      - run: echo "eula=true" > ${{ env.SD }}/eula.txt
      - run: |
          cd ${{ env.SD }}
          curl -sL -o fi.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.21-51.0.24/forge-1.21-51.0.24-installer.jar"
          java -jar fi.jar --installServer .
      - run: |
          cd ${{ env.SD }}
          SJ=$(ls forge-*-universal.jar forge-*-server.jar 2>/dev/null | head -1)
          [ -z "$SJ" ] && SJ=$(ls minecraft_server*.jar 2>/dev/null | head -1)
          java -Xmx1G -Xms512M -jar "$SJ" nogui &
          echo "pid=$!" >> $GITHUB_OUTPUT
        id: start-server
      - run: |
          for i in $(seq 1 60); do
            grep -q 'Done' ${{ env.SD }}/logs/latest.log 2>/dev/null && exit 0
            sleep 5
          done
          echo "Server failed to start"; exit 1
      - run: |
          mkdir -p ${{ env.HD }}
          curl -sL -o ${{ env.HD }}/launcher.jar "https://github.com/headlesshq/headlessmc/releases/download/2.10.0/headlessmc-launcher-2.10.0.jar"
      - run: |
          curl -sL -o ${{ env.SD }}/mods/hmc.jar "https://github.com/headlesshq/hmc-specifics/releases/download/2.4.0/hmc-specifics-1.21-2.4.0-lexforge-release.jar"
      - run: |
          cat > ${{ env.HD }}/config.properties << 'CFG'
          hmc.java.versions=$JAVA_HOME/bin/java
          hmc.offline=true
          hmc.offline.username=TestPlayer
          hmc.test.filename=${{ github.workspace }}/test-infrastructure/scenarios/skin-set-mojang.json
          hmc.test.leave.after=true
          hmc.assets.dummy=true
          hmc.always.lwjgl.flag=true
          CFG
      - run: |
          cd ${{ env.HD }}
          xvfb-run -a java -jar launcher.jar --command launch forge:1.21 \
            --game-args "--server localhost --port 25565 --username TestPlayer"
        env:
          DISPLAY: ":99"
      - run: |
          if [ -n "${{ steps.start-server.outputs.pid }}" ]; then
            kill ${{ steps.start-server.outputs.pid }} 2>/dev/null || true
          fi
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-21-${{ github.sha }}
          path: ${{ env.SD }}/logs/
          if-no-files-found: warn
  e2e-test-mc1.12.2:
    name: E2E java-8
    runs-on: ubuntu-latest
    needs: build-mc1.12.2
    if: github.ref_name == 'mc1.12.2' || github.base_ref == 'mc1.12.2'
    env:
      SD: ${{ github.workspace }}/test-server
      HD: ${{ github.workspace }}/HeadlessMC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
      - run: sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: es-skins-8-${{ github.sha }}
          path: ${{ github.workspace }}/build/
      - run: mkdir -p ${{ env.SD }}/mods ${{ env.SD }}/logs
      - run: cp ${{ github.workspace }}/build/libs/*.jar ${{ env.SD }}/mods/
      - run: echo "eula=true" > ${{ env.SD }}/eula.txt
      - run: |
          cd ${{ env.SD }}
          curl -sL -o fi.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-installer.jar"
          java -jar fi.jar --installServer .
      - run: |
          cd ${{ env.SD }}
          SJ=$(ls forge-*-universal.jar forge-*-server.jar 2>/dev/null | head -1)
          [ -z "$SJ" ] && SJ=$(ls minecraft_server*.jar 2>/dev/null | head -1)
          java -Xmx1G -Xms512M -jar "$SJ" nogui &
          echo "pid=$!" >> $GITHUB_OUTPUT
        id: start-server
      - run: |
          for i in $(seq 1 60); do
            grep -q 'Done' ${{ env.SD }}/logs/latest.log 2>/dev/null && exit 0
            sleep 5
          done
          echo "Server failed to start"; exit 1
      - run: |
          mkdir -p ${{ env.HD }}
          curl -sL -o ${{ env.HD }}/launcher.jar "https://github.com/headlesshq/headlessmc/releases/download/2.10.0/headlessmc-launcher-2.10.0.jar"
      - run: |
          curl -sL -o ${{ env.SD }}/mods/hmc.jar "https://github.com/headlesshq/hmc-specifics/releases/download/2.4.0/hmc-specifics-1.12.2-2.4.0-lexforge-release.jar"
      - run: |
          cat > ${{ env.HD }}/config.properties << 'CFG'
          hmc.java.versions=$JAVA_HOME/bin/java
          hmc.offline=true
          hmc.offline.username=TestPlayer
          hmc.test.filename=${{ github.workspace }}/test-infrastructure/scenarios/skin-set-mojang.json
          hmc.test.leave.after=true
          hmc.assets.dummy=true
          hmc.always.lwjgl.flag=true
          CFG
      - run: |
          cd ${{ env.HD }}
          xvfb-run -a java -jar launcher.jar --command launch forge:1.12.2 \
            --game-args "--server localhost --port 25565 --username TestPlayer"
        env:
          DISPLAY: ":99"
      - run: |
          if [ -n "${{ steps.start-server.outputs.pid }}" ]; then
            kill ${{ steps.start-server.outputs.pid }} 2>/dev/null || true
          fi
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-8-${{ github.sha }}
          path: ${{ env.SD }}/logs/
          if-no-files-found: warn
