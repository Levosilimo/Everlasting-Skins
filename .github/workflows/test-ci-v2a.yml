name: CI v2a
on:
  push:
    branches: ["1.21"]
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref_name == '1.21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == '1.21'
    env:
      X: y
    steps:
      - run: echo "done"
