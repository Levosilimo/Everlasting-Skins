name: CI v2
on:
  push:
    branches: ["1.21"]
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: frenck/action-yamllint@v1
        with:
          config_file: .yamllint.yml
          strict: true
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref_name == '1.21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: warn
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == '1.21'
    env:
      SERVER_DIR: ${{ github.workspace }}/test-server
      HMC_DIR: ${{ github.workspace }}/HeadlessMC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - run: sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: artifact-${{ github.sha }}
          path: ${{ github.workspace }}/build/
      - run: |
          echo "Setup server"
          echo "Running E2E"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-${{ github.sha }}
          path: .
          if-no-files-found: warn
