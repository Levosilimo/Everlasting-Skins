name: Publish

permissions:
  contents: write

on:
  push:
    tags:
      - 'mc1.21-v*'
      - 'mc1.21.1-v*'
      - 'mc1.21.4-v*'
      - 'mc1.21.8-v*'
      # NOTE: mc26.1-v* / mc26.2-v* drop the leading '1.' — MC 1.26.1 and
      # 1.26.2 are colloquially '26.1'/'26.2' and the Forge 62.x / 65.x lines
      # follow that naming (see PR body).
      - 'mc26.1-v*'
      - 'mc26.2-v*'
      - 'mc1.12.2-v*'
      - 'mc1.8.9-v*'
      - 'mc1.10.2-v*'
      - 'mc1.20.1-v*'
      - 'mc1.18.2-v*'
      - 'mc1.16.5-v*'
      - 'mc1.7.10-v*'
      - 'mc1.6.4-v*'
      - 'mc1.5.2-v*'
      # NOTE: NeoForge intentionally dropped — no mcneoforge lane.

jobs:
  # ── Per-tag module routing: tag prefix -> Gradle subproject ────
  publish:
    name: Publish (${{ matrix.game-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # NOTE: the tag gate lives on the steps, NOT the job: GitHub's
    # context-availability table excludes `matrix` from jobs.<job_id>.if,
    # and a matrix ref there rejects the whole file at registration
    # ("workflow file issue"). Step-level if supports matrix.
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: "mc1.21-v"
            module: forge-1.21
            game-version: "1.21"
            java: "21"
          - prefix: "mc1.21.1-v"
            module: forge-1.21.1
            game-version: "1.21.1"
            java: "21"
          - prefix: "mc1.21.4-v"
            module: forge-1.21.4
            game-version: "1.21.4"
            java: "21"
          - prefix: "mc1.21.8-v"
            module: forge-1.21.8
            game-version: "1.21.8"
            java: "21"
          - prefix: "mc26.2-v"
            module: forge-26.2
            game-version: "26.2"
            java: "25"
          - prefix: "mc26.1-v"
            module: forge-26.1
            game-version: "26.1"
            java: "25"
          # NOTE: mc1.20.1 / mc1.16.5 / mc1.18.2 / mc1.10.2 / mc1.6.4 /
          # mc1.5.2 have NO
          # matrix entries: since the FG lane separation (PR #2xx) they are
          # standalone builds with their own wrappers (forge-1.16.5 → Gradle
          # 7.6.4/Java 8 + FG 5.1.77; forge-1.20.1 → Gradle 8.14/Java 21 +
          # FG 6.0.54; forge-1.18.2 → Gradle 8.14/Java 21 + FG 6.0.54;
          # forge-1.10.2 → Gradle 4.10.3/Java 8 + FG 2.2.5; forge-1.6.4 →
          # Gradle 4.4.1/Java 8 + vendored SpecialSource 1.7.4 deobf
          # harness; forge-1.5.2 → Gradle 4.4.1/Java 8 + vendored
          # SpecialSource 1.7.4 deobf harness), so the shared
          # `./gradlew :${{ matrix.module }}:build` step cannot build them.
          # They publish via the dedicated publish-mc1_16_5 / publish-mc1_20_1
          # / publish-mc1_18_2 / publish-mc1_10_2 / publish-mc1_6_4 /
          # publish-mc1_5_2 jobs below.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ matrix.game-version }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.game-version }}-
            gradle-${{ runner.os }}-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build
        if: startsWith(github.ref_name, matrix.prefix)
        run: ./gradlew :${{ matrix.module }}:build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Publish to CurseForge, Modrinth, GitHub Releases
        if: startsWith(github.ref_name, matrix.prefix)
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: ${{ matrix.game-version }}
          game-version-filter: releases
          environment: server
          files: ${{ matrix.module }}/build/libs/*.jar
          fail-mode: fail
          retry-attempts: 3
          retry-delay: 15000

  # ── mc1.12.2 out-of-band lane (own wrapper, JDK 8) ─────────────
  publish-mc1_12_2:
    name: Publish (mc1.12.2)
    if: startsWith(github.ref_name, 'mc1.12.2-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

