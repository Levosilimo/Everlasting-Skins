name: Publish

permissions:
  contents: write

on:
  push:
    tags:
      - 'mc1.21-v*'
      - 'mc1.21.1-v*'
      - 'mc1.21.4-v*'
      - 'mc1.21.8-v*'
      - 'mc1.12.2-v*'
      # mc1.20.1 / mc1.16.5: tag triggers + matrix entries stay commented
      # until both lanes reach SOURCE-COMPLETE state. PR #261 landed the
      # subprojects in settings.gradle.kts, but they are scaffold-only
      # (no main-source carry-over): a publish run on these tags would fail
      # :forge-1.20.1:build / :forge-1.16.5:build and ship no jar. ENABLE
      # the tag triggers AND the matrix entries together, once those builds
      # produce a real jar.
      # - 'mc1.20.1-v*'
      # - 'mc1.16.5-v*'
      # NOTE: NeoForge intentionally dropped — no mcneoforge lane.

jobs:
  # ── Per-tag module routing: tag prefix -> Gradle subproject ────
  publish:
    name: Publish (${{ matrix.game-version }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, matrix.prefix)
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: "mc1.21-v"
            module: forge-1.21
            game-version: "1.21"
            java: "21"
          - prefix: "mc1.21.1-v"
            module: forge-1.21.1
            game-version: "1.21.1"
            java: "21"
          - prefix: "mc1.21.4-v"
            module: forge-1.21.4
            game-version: "1.21.4"
            java: "21"
          - prefix: "mc1.21.8-v"
            module: forge-1.21.8
            game-version: "1.21.8"
            java: "21"
          # mc1.20.1 / mc1.16.5 matrix entries stay commented: the
          # subprojects are scaffold-only until the partial ports complete
          # (main-source carry-over). Re-enable once :forge-1.20.1:build
          # and :forge-1.16.5:build pass and produce a jar with mod
          # classes — not just resources.
          # - prefix: "mc1.20.1-v"
          #   module: forge-1.20.1
          #   game-version: "1.20.1"
          #   java: "17"
          # - prefix: "mc1.16.5-v"
          #   module: forge-1.16.5
          #   game-version: "1.16.5"
          #   java: "8"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ matrix.game-version }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.game-version }}-
            gradle-${{ runner.os }}-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew :${{ matrix.module }}:build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Publish to CurseForge, Modrinth, GitHub Releases
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: ${{ matrix.game-version }}
          game-version-filter: releases
          environment: server
          files: ${{ matrix.module }}/build/libs/*.jar
          fail-mode: warn
          retry-attempts: 3
          retry-delay: 15000

  # ── mc1.12.2 out-of-band lane (own wrapper, JDK 8) ─────────────
  publish-mc1_12_2:
    name: Publish (mc1.12.2)
    if: startsWith(github.ref_name, 'mc1.12.2-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: "mc1.12.2"

      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-mc1.12.2
          restore-keys: |
            gradle-${{ runner.os }}-mc1.12.2-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Publish to CurseForge, Modrinth, GitHub Releases
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: "1.12.2"
          game-version-filter: releases
          environment: server
          files: build/libs/*.jar
          fail-mode: warn
          retry-attempts: 3
          retry-delay: 15000
