name: Publish

permissions:
  contents: write

on:
  push:
    tags:
      - 'mc1.21-v*'
      - 'mc1.21.1-v*'
      - 'mc1.21.4-v*'
      - 'mc1.21.8-v*'
      - 'mc1.12.2-v*'
      - 'mc1.20.1-v*'
      - 'mc1.16.5-v*'
      # NOTE: NeoForge intentionally dropped — no mcneoforge lane.

jobs:
  # ── Per-tag module routing: tag prefix -> Gradle subproject ────
  publish:
    name: Publish (${{ matrix.game-version }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, matrix.prefix)
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: "mc1.21-v"
            module: forge-1.21
            game-version: "1.21"
            java: "21"
          - prefix: "mc1.21.1-v"
            module: forge-1.21.1
            game-version: "1.21.1"
            java: "21"
          - prefix: "mc1.21.4-v"
            module: forge-1.21.4
            game-version: "1.21.4"
            java: "21"
          - prefix: "mc1.21.8-v"
            module: forge-1.21.8
            game-version: "1.21.8"
            java: "21"
          # NOTE: mc1.20.1 / mc1.16.5 have NO matrix entries: since the FG
          # lane separation (PR #2xx) they are standalone builds with their
          # own wrappers (forge-1.16.5 → Gradle 7.6.4/Java 8 + FG 5.1.77;
          # forge-1.20.1 → Gradle 8.7/Java 21 + FG 6.0.54), so the shared
          # `./gradlew :${{ matrix.module }}:build` step cannot build them.
          # They publish via the dedicated publish-mc1_16_5 /
          # publish-mc1_20_1 jobs below.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ matrix.game-version }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.game-version }}-
            gradle-${{ runner.os }}-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew :${{ matrix.module }}:build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Publish to CurseForge, Modrinth, GitHub Releases
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: ${{ matrix.game-version }}
          game-version-filter: releases
          environment: server
          files: ${{ matrix.module }}/build/libs/*.jar
          fail-mode: warn
          retry-attempts: 3
          retry-delay: 15000

  # ── mc1.12.2 out-of-band lane (own wrapper, JDK 8) ─────────────
  publish-mc1_12_2:
    name: Publish (mc1.12.2)
    if: startsWith(github.ref_name, 'mc1.12.2-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-mc1.12.2
          restore-keys: |
            gradle-${{ runner.os }}-mc1.12.2-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x mc1.12.2/gradlew

      - name: Build
        run: cd mc1.12.2 && ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Publish to CurseForge, Modrinth, GitHub Releases
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: "1.12.2"
          game-version-filter: releases
          environment: server
          files: mc1.12.2/build/libs/*.jar
          fail-mode: warn
          retry-attempts: 3
          retry-delay: 15000

  # ── forge-1.16.5 out-of-band lane (own wrapper, JDK 8) ────────
  publish-mc1_16_5:
    name: Publish (mc1.16.5)
    if: startsWith(github.ref_name, 'mc1.16.5-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-forge-1.16.5
          restore-keys: |
            gradle-${{ runner.os }}-forge-1.16.5-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x forge-1.16.5/gradlew

      - name: Build
        run: cd forge-1.16.5 && ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Publish to CurseForge, Modrinth, GitHub Releases
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: "1.16.5"
          game-version-filter: releases
          environment: server
          files: forge-1.16.5/build/libs/*.jar
          fail-mode: warn
          retry-attempts: 3
          retry-delay: 15000

  # ── forge-1.20.1 out-of-band lane (own wrapper, JDK 21) ────────
  publish-mc1_20_1:
    name: Publish (mc1.20.1)
    if: startsWith(github.ref_name, 'mc1.20.1-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-forge-1.20.1
          restore-keys: |
            gradle-${{ runner.os }}-forge-1.20.1-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x forge-1.20.1/gradlew

      - name: Build
        run: cd forge-1.20.1 && ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Publish to CurseForge, Modrinth, GitHub Releases
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: "1.20.1"
          game-version-filter: releases
          environment: server
          files: forge-1.20.1/build/libs/*.jar
          fail-mode: warn
          retry-attempts: 3
          retry-delay: 15000
