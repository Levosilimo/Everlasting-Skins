name: Publish

permissions:
  contents: write

on:
  push:
    tags:
      - 'mc1.21-v*'
      - 'mc1.21.1-v*'
      - 'mc1.21.4-v*'
      - 'mc1.21.8-v*'
      # NOTE: mc26.1-v* / mc26.2-v* drop the leading '1.' — MC 1.26.1 and
      # 1.26.2 are colloquially '26.1'/'26.2' and the Forge 62.x / 65.x lines
      # follow that naming (see PR body).
      - 'mc26.1-v*'
      - 'mc26.2-v*'
      - 'mc1.12.2-v*'
      - 'mc1.8.9-v*'
      - 'mc1.10.2-v*'
      - 'mc1.20.1-v*'
      - 'mc1.18.2-v*'
      - 'mc1.16.5-v*'
      - 'mc1.7.10-v*'
      - 'mc1.6.4-v*'
      - 'mc1.5.2-v*'
      - 'mc1.4.7-v*'
      # NOTE: NeoForge intentionally dropped — no mcneoforge lane.

jobs:
  # ── Per-tag module routing: tag prefix -> Gradle subproject ────
  publish:
    name: Publish (${{ matrix.game-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # NOTE: the tag gate lives on the steps, NOT the job: GitHub's
    # context-availability table excludes `matrix` from jobs.<job_id>.if,
    # and a matrix ref there rejects the whole file at registration
    # ("workflow file issue"). Step-level if supports matrix.
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: "mc1.21-v"
            module: forge-1.21
            game-version: "1.21"
            java: "21"
          - prefix: "mc1.21.1-v"
            module: forge-1.21.1
            game-version: "1.21.1"
            java: "21"
          - prefix: "mc1.21.4-v"
            module: forge-1.21.4
            game-version: "1.21.4"
            java: "21"
          - prefix: "mc1.21.8-v"
            module: forge-1.21.8
            game-version: "1.21.8"
            java: "21"
          - prefix: "mc26.2-v"
            module: forge-26.2
            game-version: "26.2"
            java: "25"
          - prefix: "mc26.1-v"
            module: forge-26.1
            game-version: "26.1"
            java: "25"
          # NOTE: mc1.20.1 / mc1.16.5 / mc1.18.2 / mc1.10.2 / mc1.6.4 /
          # mc1.5.2 / mc1.4.7 have NO
          # matrix entries: since the FG lane separation (PR #2xx) they are
          # standalone builds with their own wrappers (forge-1.16.5 → Gradle
          # 7.6.4/Java 8 + FG 5.1.77; forge-1.20.1 → Gradle 8.14/Java 21 +
          # FG 6.0.54; forge-1.18.2 → Gradle 8.14/Java 21 + FG 6.0.54;
          # forge-1.10.2 → Gradle 4.10.3/Java 8 + FG 2.2.5; forge-1.6.4 →
          # Gradle 4.4.1/Java 8 + vendored SpecialSource 1.7.4 deobf
          # harness; forge-1.5.2 → Gradle 4.4.1/Java 8 + vendored
          # SpecialSource 1.7.4 deobf harness; forge-1.4.7 → Gradle 4.4.1/
          # Java 8 + vendored SpecialSource 1.7.4 deobf harness), so the shared
          # `./gradlew :${{ matrix.module }}:build` step cannot build them.
          # They publish via the dedicated publish-mc1_16_5 / publish-mc1_20_1
          # / publish-mc1_18_2 / publish-mc1_10_2 / publish-mc1_6_4 /
          # publish-mc1_5_2 / publish-mc1_4_7 jobs below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          cache-provider: basic
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # NOTE: `clean` prevents stale-jar accumulation in build/libs — the
      # root cause of the old mc-publish "additional files" duplicate uploads
      # (stale jars from no-clean builds, plus -sources.jar leftovers).
      - name: Build
        if: startsWith(github.ref_name, matrix.prefix)
        run: ./gradlew clean :${{ matrix.module }}:build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      # GitHub Releases only (2026-08-14): Modrinth + CurseForge publishing
      # removed by user decision. The glob is the SINGLE primary jar —
      # archivesName is everlastingskins-<mcVersion> in every lane and the
      # clean build above guarantees exactly one jar in build/libs.
      - name: Publish to GitHub Releases
        if: startsWith(github.ref_name, matrix.prefix)
        run: gh release create "$GITHUB_REF_NAME" ${{ matrix.module }}/build/libs/everlastingskins-${{ matrix.game-version }}-*.jar --title "Everlasting Skins $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── mc1.12.2 out-of-band lane (own wrapper, JDK 8) ─────────────
  publish-mc1_12_2:
    name: Publish (mc1.12.2)
    if: startsWith(github.ref_name, 'mc1.12.2-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-mc1.12.2
          restore-keys: |
            gradle-${{ runner.os }}-mc1.12.2-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x mc1.12.2/gradlew

      - name: Build
        run: cd mc1.12.2 && ./gradlew clean build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Publish to GitHub Releases
        run: gh release create "$GITHUB_REF_NAME" mc1.12.2/build/libs/everlastingskins-1.12.2-*.jar --title "Everlasting Skins $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── forge-1.16.5 out-of-band lane (own wrapper, JDK 8) ────────
