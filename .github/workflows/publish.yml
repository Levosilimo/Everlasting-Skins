name: Publish

permissions:
  contents: write

on:
  push:
    tags:
      - 'mc1.21-v*'
      - 'mc1.21.8-v*'
      - 'mc1.12.2-v*'

jobs:
  publish-1_21:
    if: startsWith(github.ref_name, 'mc1.21')
    runs-on: ubuntu-latest
    name: java-21

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: "1.21"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-1.21
          restore-keys: |
            gradle-${{ runner.os }}-1.21-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Publish to CurseForge, Modrinth, GitHub Releases
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: "1.21"
          game-version-filter: releases
          environment: server
          files: build/libs/*.jar
          fail-mode: warn
          retry-attempts: 3
          retry-delay: 15000

  publish-1_21_8:
    if: startsWith(github.ref_name, 'mc1.21.1-v')
    runs-on: ubuntu-latest
    name: java-21

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: "${{ github.ref_name }}"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-1.21.8
          restore-keys: |
            gradle-${{ runner.os }}-1.21.8-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Publish to CurseForge, Modrinth, GitHub Releases
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: "1.21.8"
          game-version-filter: releases
          environment: server
          files: build/libs/*.jar
          fail-mode: warn
          retry-attempts: 3
          retry-delay: 15000

  publish-mc1_12_2:
    if: startsWith(github.ref_name, 'mc1.12.2')
    runs-on: ubuntu-latest
    name: java-8

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: "mc1.12.2"

      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-mc1.12.2
          restore-keys: |
            gradle-${{ runner.os }}-mc1.12.2-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Publish to CurseForge, Modrinth, GitHub Releases
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3
        with:
          curseforge-id: 538149
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: everlasting-skins
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.ref_name }}
          name: "Everlasting Skins ${{ github.ref_name }}"
          version-type: release
          loaders: forge
          game-versions: "1.12.2"
          game-version-filter: releases
          environment: server
          files: build/libs/*.jar
          fail-mode: warn
          retry-attempts: 3
          retry-delay: 15000
