name: Test HashFiles
on:
  push:
    branches: ["1.21"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/nonexistent.file') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: echo "done"
