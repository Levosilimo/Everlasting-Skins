name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # ── Lint all YAML files once ───────────────────────────────────
  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          config_file: .yamllint.yml
          strict: true

  # ── Build matrix over the M2 modules (JDK 21) ──────────────────
  build:
    name: Build (${{ matrix.mc }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 30 }}
    needs: lint-yaml
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: common
            mc: common
          - module: forge-1.21
            mc: "1.21"
          - module: forge-1.21.1
            mc: "1.21.1"
          - module: forge-1.21.4
            mc: "1.21.4"
          - module: forge-1.21.8
            mc: "1.21.8"
          - module: forge-26.2
            mc: "26.2"
            java: "25"
            timeout: 45   # heaviest: Java 25 + unobfuscated MC + FG 7.0.17
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK ${{ matrix.java || '21' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: ${{ matrix.java || '21' }}
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-m2-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-m2-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify test count meets minimum
        run: |
          COUNT=$(grep -r "@Test" --include="*.java" common/src forge-1.21/src 2>/dev/null | wc -l)
          echo "Test count: $COUNT"
          if [ "$COUNT" -lt 150 ]; then
            echo "ERROR: Test count dropped below 150 (got $COUNT)"
            exit 1
          fi
      - name: Build module
        run: ./gradlew :${{ matrix.module }}:build --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: mod-${{ matrix.mc }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: warn

  # ── mc1.12.2 out-of-band lane (own wrapper, JDK 8) ─────────────
  build-mc1_12_2:
    name: Build (mc1.12.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
