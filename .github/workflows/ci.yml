  # ── aislop quality gate (same scanner as the pre-commit hook) ─
  aislop:
    name: aislop (M2)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint-yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
      - name: Run aislop gate on PR changes
        # Diff against the PR's actual base branch (github.base_ref); on
        # push events fall back to origin/main.
        run: npx -y aislop ci --changes --base origin/${{ github.base_ref || 'main' }}

