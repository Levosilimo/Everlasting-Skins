name: CI

on:
  push:
    branches: ["1.21", "mc1.12.2"]
  pull_request:
    branches: ["1.21", "mc1.12.2"]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run yamllint
        uses: frenck/action-yamllint@v1
        with:
          config_file: .yamllint.yml
          strict: true

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: lint-yaml
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: java-21
            branch: "1.21"
            java-version: 21
            java-distribution: temurin
          - name: java-8
            branch: "mc1.12.2"
            java-version: 8
            java-distribution: temurin
    if: (github.event_name == 'push' && github.ref_name == matrix.branch) || (github.event_name == 'pull_request' && github.base_ref == matrix.branch)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.java-distribution }}

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run aislop scanner (informational)
        continue-on-error: true
        run: |
          if command -v bunx &> /dev/null; then
            bunx aislop scan
          elif command -v npx &> /dev/null; then
            npx aislop scan
          else
            echo "aislop skipped: neither bunx nor npx on PATH"
          fi

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: everlasting-skins-${{ matrix.name }}-${{ github.sha }}
          path: |
            build/libs/*.jar

  e2e-test:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [lint-yaml, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: java-21
            branch: "1.21"
            java-version: 21
            java-distribution: temurin
            mc-version: "1.21"
            mc-forge-version: "51.0.8"
          - name: java-8
            branch: "mc1.12.2"
            java-version: 8
            java-distribution: temurin
            mc-version: "1.12.2"
            mc-forge-version: "14.23.5.2847"
    if: (github.event_name == 'push' && github.ref_name == matrix.branch) || (github.event_name == 'pull_request' && github.base_ref == matrix.branch)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.java-distribution }}
          java-version: ${{ matrix.java-version }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew test --no-daemon
      - name: Run HeadlessMC scenario
        uses: headlesshq/mc-runtime-test@4.5.1
        with:
          mc: ${{ matrix.mc-version }}
          modloader: forge
          version: ${{ matrix.mc-forge-version }}
          xvfb: true
          cache-mc: github
          scenario: test-infrastructure/scenarios/skin-set-mojang.json
