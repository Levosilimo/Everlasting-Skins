  # ── E2E (modern lanes, informational) ─────────────────────────
  # Real-client E2E for the remaining matrix lanes (master plan
  # real-client-e2e-plan.md): forge-1.18.2 / forge-1.20.1 run the slice-4
  # boot-smoke floor (each lane's run-e2e.sh builds the lane, boots a
  # PRODUCTION Forge server (pinned installer --installServer, mod jar in
  # mods/, online-mode=false) and launches the real dev client (runClient)
  # under xvfb-run + Mesa llvmpipe; the boot-smoke asserts the server boot
  # line + the client join line on the server log). forge-1.16.5 runs the
  # FULL slice-3 in-jar driver too (its wrapper points at modern-injar.sh;
  # see the dedicated E2E (forge-1.16.5 full in-jar) job). forge-26.1 /
  # forge-26.2 run the FULL slice-3 in-jar driver (modern-injar era): the
  # same production server + xvfb client, plus the in-jar E2EDriver
  # round-trip — /skin set mojang TestPlayer, tab-list textures
  # sentinel-marker assert, result JSON + exit-code mapping (26.x port of
  # the 1.21 flow). The 1.21.x point releases are NOT here: they run the
  # slice-3 in-jar driver (e2e-modern-121 above).
  # INFORMATIONAL — NOT part of the required-check
  # contract (no gh-api-bump). Per-lane JDK: 8 (1.16.5 FG 5.1 lane),
  # 21 (1.18.2/1.20.1 Gradle 8.14 daemon + Java 17 toolchain via foojay),
  # 25 (26.x unobfuscated line). Mesa software GL is required (the modern
  # client is a real GL client, same apt set as the pre-1.8 lanes); xvfb is
  # preinstalled on ubuntu-24.04. RUNNER_TMP must be a STEP env.
  e2e-modern:
    name: E2E (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [lint-yaml, changes]
    # Always runs (per-leg step gate): a job-level-skipped matrix would
    # register one template-named check-run and leave the per-lane required
    # contexts MISSING (BLOCKED). Unselected legs skip every step -> success.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: forge-1.16.5
            filter-key: forge_1_16_5
            java: "8"
            fgver: 1.16.5-36.2.34
          - lane: forge-1.18.2
            filter-key: forge_1_18_2
            java: "21"
            fgver: 1.18.2-40.3.0
          - lane: forge-1.20.1
            filter-key: forge_1_20_1
            java: "21"
            fgver: 1.20.1-47.4.10
          - lane: forge-26.1
            filter-key: forge_26_1
            java: "25"
            fgver: 26.1-62.0.9
          - lane: forge-26.2
            filter-key: forge_26_2
            java: "25"
            fgver: 26.2-65.0.9
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Lane gate (skip-as-success for required checks)
        id: gate
        if: >-
          github.event_name == 'push' ||
          needs.changes.outputs[matrix.filter-key] == 'true' ||
          needs.changes.outputs.common == 'true' ||
          needs.changes.outputs.buildSrc == 'true' ||
          needs.changes.outputs.gradle_infra == 'true' ||
          needs.changes.outputs.e2e_infra == 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        if: steps.gate.outputs.run == 'true'
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up JDK 17 (production Forge server for the 1.18.2/1.20.1 E2E)
        # Cold-cache-proof server JDK: the lane wrapper's ~/.gradle/jdks glob
        # only hits a warm foojay cache and misses the inner-dir layout
        # (jdk-*/), and ubuntu-24.04 has no /usr/lib/jvm/java-17-openjdk-amd64,
        # so a cache-missed E2E run still died with "Java 17 not found" after
        # #457's reorder (run 31599664358). setup-java overwrites JAVA_HOME
        # with 17 — fine here: both lanes compile with the Java 17 toolchain
        # (build.gradle.kts toolchain 17), so the Gradle daemon on 17 satisfies
        # the build, and the exported E2E_JAVA17_HOME feeds the production
        # server fork.
        if: (matrix.lane == 'forge-1.18.2' || matrix.lane == 'forge-1.20.1') && steps.gate.outputs.run == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "17"
          distribution: temurin
      - name: Export E2E_JAVA17_HOME (server JDK for the 1.18.2/1.20.1 wrappers)
        if: (matrix.lane == 'forge-1.18.2' || matrix.lane == 'forge-1.20.1') && steps.gate.outputs.run == 'true'
        run: echo "E2E_JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install Mesa software GL (llvmpipe for the real modern client)
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 mesa-utils \
            libxrandr2 libxxf86vm1 libxcursor1 libxi6 libxinerama1 \
            libasound2t64 libopenal1 x11-xserver-utils
      - name: Cache FG userdev blobs (stable, keyed on MC/Forge version)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: |
            ~/.gradle/caches/minecraftforge
            ~/.gradle/caches/forge_gradle
            ~/.gradle/everlastingskins-vendored
          key: fg-userdev-${{ runner.os }}-${{ matrix.lane }}-${{ matrix.fgver }}
          restore-keys: |
            fg-userdev-${{ runner.os }}-${{ matrix.lane }}-
      - name: Cache Gradle wrapper and module deps (volatile, wrapper hash)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/jdks
          key: gradle-deps-${{ runner.os }}-${{ matrix.lane }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-${{ matrix.lane }}-
      - name: Cache E2E downloads (forge installers, server libraries)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: ~/.cache/everlastingskins
          key: e2e-${{ matrix.lane }}-${{ runner.os }}
          restore-keys: |
            e2e-${{ matrix.lane }}-${{ runner.os }}-
      - name: Run real-client E2E (boot-smoke or full in-jar driver per lane)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        if: steps.gate.outputs.run == 'true'
        with:
          timeout_minutes: 40
          max_attempts: 3
          retry_on: error
          command: bash ${{ matrix.lane }}/test-infrastructure/run-e2e.sh
        timeout-minutes: 45
        env:
          RUNNER_TMP: ${{ runner.temp }}/everlastingskins-e2e
      - name: Upload E2E logs + result (always)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-modern-${{ matrix.lane }}-logs
          path: |
            ${{ runner.temp }}/everlastingskins-e2e/e2e-result.json
            ${{ runner.temp }}/everlastingskins-e2e/**/*.log
          if-no-files-found: warn

  # ── GameTest on 1.21 (canonical gametest subproject) ──────────
  gametest-121:
    name: GameTest (1.21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint-yaml, changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.forge_1_21 == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.buildSrc == 'true' ||
      needs.changes.outputs.gradle_infra == 'true' ||
      needs.changes.outputs.e2e_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: 21
          distribution: temurin
      - name: Set up Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          cache-provider: basic
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run GameTest (skin visibility packets)
        # CI-IMPROVEMENT-ROADMAP P1-8: 15 min is correct for a warm cache but
        # turns a cold-cache PR run into a guaranteed red check + manual
        # re-run (fix-10: cancelled at 15m15s on PR #314 cold cache; warm runs
        # finish in 2.5-6 min). 30 min bounds the runaway case while
        # tolerating cache misses.
        # CI-perf phase 1: step-level retry self-heals the documented
        # infra-noise signatures (Mavenizer cache-miss / HTTP timeouts /
        # 429 — AGENTS.md lib-58) inside the same check-run; retries reuse
        # the on-disk ~/.gradle state, so they are warm.
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_on: error
          command: ./gradlew :forge-1.21:runGameTestServer --no-daemon --console=plain --configure-on-demand
        timeout-minutes: 30
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Dfile.encoding=UTF-8
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
            --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
            -Dio.netty.tryReflectionSetAccessible=true"

