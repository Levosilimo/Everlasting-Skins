name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR-scoped cancel (CI-perf phase 1): check-runs bind to the head SHA, so
  # cancelling a superseded PR run is safe; main-push runs are NOT cancelled
  # (a mid-merge cancel would orphan the required checks the merge waits on).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # ── Lint all YAML files once ───────────────────────────────────
  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          config_file: .yamllint.yml
          strict: true
      - name: Check CI Mesa apt packages (t64 ALSA only)
        run: bash scripts/check-ci-mesa.sh

  # ── Path filter: per-lane change detection (CI-perf phase 1) ──
  # Gates every lane-specific job so a PR only runs the lanes it touches
  # (the repo hits the 20-concurrent-job account cap; a 7-PR fleet is
  # ~1,575 jobs, compounded by auto-update-pr-branches full-matrix re-runs).
  # REQUIRED-CHECK-SAFE (verified 2026-08-14 against the live 37-context
  # contract): GitHub treats a job-level-skipped JOB as success for required
  # checks, but a job-level-skipped MATRIX job registers ONE check-run with
  # the unexpanded template name (e.g. `Build (${{ matrix.mc }})`), which
  # satisfies NO required context — those contexts go MISSING and the PR is
  # BLOCKED. So the matrix jobs (build, e2e-*) always run and gate each leg
  # via a step-level lane gate (all steps skipped => leg success under the
  # expanded name); the non-matrix lane jobs keep job-level `if:` gating
  # (skipped = success for required checks). Job names are never renamed,
  # `on:` triggers are unchanged (workflow-trigger-level path filtering is
  # the contract-breaking form). Shared paths (common, buildSrc,
  # gradle_infra, e2e_infra) force all lanes. push:main short-circuits every
  # gate (github.event_name == 'push'), so post-merge full verification is
  # preserved.
  changes:
    name: Path filter
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint-yaml
    outputs:
      common: ${{ steps.filter.outputs.common }}
      buildSrc: ${{ steps.filter.outputs.buildSrc }}
      gradle_infra: ${{ steps.filter.outputs.gradle_infra }}
      e2e_infra: ${{ steps.filter.outputs.e2e_infra }}
      forge_1_21: ${{ steps.filter.outputs.forge_1_21 }}
      forge_1_21_1: ${{ steps.filter.outputs.forge_1_21_1 }}
      forge_1_21_4: ${{ steps.filter.outputs.forge_1_21_4 }}
      forge_1_21_8: ${{ steps.filter.outputs.forge_1_21_8 }}
      forge_26_2: ${{ steps.filter.outputs.forge_26_2 }}
      forge_26_1: ${{ steps.filter.outputs.forge_26_1 }}
      mc1_12_2: ${{ steps.filter.outputs.mc1_12_2 }}
      forge_1_16_5: ${{ steps.filter.outputs.forge_1_16_5 }}
      forge_1_18_2: ${{ steps.filter.outputs.forge_1_18_2 }}
      forge_1_20_1: ${{ steps.filter.outputs.forge_1_20_1 }}
      forge_1_7_10: ${{ steps.filter.outputs.forge_1_7_10 }}
      forge_1_8_9: ${{ steps.filter.outputs.forge_1_8_9 }}
      forge_1_10_2: ${{ steps.filter.outputs.forge_1_10_2 }}
      forge_1_6_4: ${{ steps.filter.outputs.forge_1_6_4 }}
      forge_1_5_2: ${{ steps.filter.outputs.forge_1_5_2 }}
      forge_1_4_7: ${{ steps.filter.outputs.forge_1_4_7 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed paths per lane
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3
        with:
          filters: |
            common:
              - 'common/**'
            buildSrc:
              - 'buildSrc/**'
            gradle_infra:
              - 'gradle.properties'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - '.github/workflows/ci.yml'
              - 'AGENTS.md'
              - 'scripts/**'
            e2e_infra:
              - 'scripts/e2e/**'
              - '**/test-infrastructure/**'
            forge_1_21:
              - 'forge-1.21/**'
            forge_1_21_1:
              - 'forge-1.21.1/**'
            forge_1_21_4:
              - 'forge-1.21.4/**'
            forge_1_21_8:
              - 'forge-1.21.8/**'
            forge_26_2:
              - 'forge-26.2/**'
            forge_26_1:
              - 'forge-26.1/**'
            mc1_12_2:
              - 'mc1.12.2/**'
            forge_1_16_5:
              - 'forge-1.16.5/**'
            forge_1_18_2:
              - 'forge-1.18.2/**'
            forge_1_20_1:
              - 'forge-1.20.1/**'
            forge_1_7_10:
              - 'forge-1.7.10/**'
            forge_1_8_9:
              - 'forge-1.8.9/**'
            forge_1_10_2:
              - 'forge-1.10.2/**'
            forge_1_6_4:
              - 'forge-1.6.4/**'
            forge_1_5_2:
              - 'forge-1.5.2/**'
            forge_1_4_7:
              - 'forge-1.4.7/**'

  # ── Build matrix over the M2 modules (JDK 21) ──────────────────
  build:
    name: Build (${{ matrix.mc }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout || 30 }}
    needs: [lint-yaml, changes]
    # Always runs (no job-level if:) so every leg registers its
    # properly-named check-run; a job-level-skipped matrix registers one
    # template-named run (`Build (${{ matrix.mc }})`) that satisfies no
    # required context. Unselected legs skip every step and report success.
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: common
            mc: common
            lane: common
          - module: forge-1.21
            mc: "1.21"
            lane: forge_1_21
          - module: forge-1.21.1
            mc: "1.21.1"
            lane: forge_1_21_1
          - module: forge-1.21.4
            mc: "1.21.4"
            lane: forge_1_21_4
          - module: forge-1.21.8
            mc: "1.21.8"
            lane: forge_1_21_8
          - module: forge-26.2
            mc: "26.2"
            java: "25"
            lane: forge_26_2
            timeout: 45   # heaviest: Java 25 + unobfuscated MC + FG 7.0.17
          - module: forge-26.1
            mc: "26.1"
            java: "25"
            lane: forge_26_1
            timeout: 45   # heaviest: Java 25 + unobfuscated MC + FG 7.0.17
    steps:
      - name: Lane gate (skip-as-success for required checks)
        id: gate
        if: >-
          github.event_name == 'push' ||
          needs.changes.outputs[matrix.lane] == 'true' ||
          needs.changes.outputs.common == 'true' ||
          needs.changes.outputs.buildSrc == 'true' ||
          needs.changes.outputs.gradle_infra == 'true' ||
          needs.changes.outputs.e2e_infra == 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - name: Set up JDK ${{ matrix.java || '21' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        if: steps.gate.outputs.run == 'true'
        with:
          java-version: ${{ matrix.java || '21' }}
          distribution: temurin
      - name: Set up Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        if: steps.gate.outputs.run == 'true'
        with:
          cache-provider: basic
      - name: Grant execute permission for gradlew
        if: steps.gate.outputs.run == 'true'
        run: chmod +x gradlew
      - name: Verify test count meets minimum
        # CI-IMPROVEMENT-ROADMAP P0-5: run once on the common leg instead of
        # once per matrix leg (8 identical greps today). Regex aligned with
        # scripts/test-count-gate.sh (@Test OR @ParameterizedTest). Gated like
        # every other step so an unselected leg cannot run it against an empty
        # checkout (failed with count 0 on run 31841080337).
        if: matrix.mc == 'common' && steps.gate.outputs.run == 'true'
        run: |
          COUNT=$(grep -rE "@(Test|ParameterizedTest)\b" --include="*.java" common/src forge-1.21/src forge-test-shared/src 2>/dev/null | wc -l)
          echo "Test count: $COUNT"
          if [ "$COUNT" -lt 150 ]; then
            echo "ERROR: Test count dropped below 150 (got $COUNT)"
            exit 1
          fi
      - name: Build module
        if: steps.gate.outputs.run == 'true'
        run: ./gradlew :${{ matrix.module }}:build --no-daemon --stacktrace --configure-on-demand
      - name: Upload built jar
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mod-${{ matrix.mc }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: warn

  # ── mc1.12.2 out-of-band lane (own wrapper, JDK 8) ─────────────
  build-mc1_12_2:
    name: Build (mc1.12.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint-yaml, changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.mc1_12_2 == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.buildSrc == 'true' ||
      needs.changes.outputs.gradle_infra == 'true' ||
      needs.changes.outputs.e2e_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin
      - name: Cache FG userdev blobs (stable, keyed on MC/Forge version)
        # CI-perf phase 1 cache split: the userdev blob (~5GB) used to share
        # a key with volatile module deps, so dep churn evicted it (LRU under
        # the 10GB repo cap) -> intermittent cold mavenizer runs (8-18 min).
        # Keyed on the Forge version (1.12.2-14.23.5.2847) it stays warm.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches/minecraftforge
            ~/.gradle/caches/forge_gradle
            ~/.gradle/everlastingskins-vendored
          key: fg-userdev-${{ runner.os }}-mc1.12.2-1.12.2-14.23.5.2847
          restore-keys: |
            fg-userdev-${{ runner.os }}-mc1.12.2-
      - name: Cache Gradle wrapper and module deps (volatile, wrapper hash)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
          key: gradle-deps-${{ runner.os }}-mc1.12.2-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-mc1.12.2-
      - name: Grant execute permission for gradlew
        run: chmod +x mc1.12.2/gradlew
      - name: Build and test
        run: cd mc1.12.2 && ./gradlew build --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mod-mc1.12.2
          path: mc1.12.2/build/libs/*.jar
          if-no-files-found: warn

