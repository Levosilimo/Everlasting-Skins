        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-mc1.12.2-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-mc1.12.2-
      - name: Grant execute permission for gradlew
        run: chmod +x mc1.12.2/gradlew
      - name: Build and test
        run: cd mc1.12.2 && ./gradlew build --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
