  # ── aislop quality gate (same scanner as the pre-commit hook) ─
  aislop:
    name: aislop (M2)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint-yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
      - name: Run aislop gate on PR changes
        # Diff against the PR's actual base branch (github.base_ref); on
        # push events fall back to origin/main.
        run: npx -y aislop ci --changes --base origin/${{ github.base_ref || 'main' }}

  # ── CI Health: gradle-health.sh + dep-analysis projectHealth ──
  # Required check (gh-api-bump/CI-Health.sh, lib-69): part of the
  # 22-context branch-protection contract. Graduated lanes
  # (depAnalysis.graduateDuplicateClass=true) FAIL on a duplicate-class
  # finding (the zero-FP category); WARN-only reflection-FP categories
  # never fail it.
  # CI-perf phase 1 re-scope: the sweep runs projectHealth ONLY on the
  # graduated lanes + :common (the WARN-only reflection-FP categories on
  # the remaining modules add no gate value but were the long pole — ~28
  # min wall clock). The explicit --lanes list keeps the sweep
  # deterministic; gradle-health.sh defaults to the same set.
  ci-health:
    name: CI Health
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint-yaml, changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.forge_1_21 == 'true' ||
      needs.changes.outputs.forge_1_21_1 == 'true' ||
      needs.changes.outputs.forge_1_21_4 == 'true' ||
      needs.changes.outputs.forge_1_21_8 == 'true' ||
      needs.changes.outputs.forge_26_2 == 'true' ||
      needs.changes.outputs.forge_26_1 == 'true' ||
      needs.changes.outputs.buildSrc == 'true' ||
      needs.changes.outputs.gradle_infra == 'true' ||
      needs.changes.outputs.e2e_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: 21
          distribution: temurin
      - name: Set up Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          cache-provider: basic
      - name: chmod +x gradlew
        run: chmod +x gradlew
      - name: Run CI Health (gradle-health.sh + dep-analysis)
        # Graduated lanes fail on duplicate-class findings (zero-FP);
        # :common stays WARN-forever. Sweeps :common + the six graduated
        # in-root modules (explicit lane list; script default = same set).
        # Runs ONLINE: --offline failed on cold Gradle caches (foojay plugin /
        # FG userdev unresolvable), which used to be masked by `|| true` and
        # surfaced as a required-check failure once the script propagated exits.
        run: bash scripts/gradle-health.sh --lanes :common,:forge-1.21,:forge-1.21.1,:forge-1.21.4,:forge-1.21.8,:forge-26.2,:forge-26.1
