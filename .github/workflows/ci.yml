  # ── E2E (mc1.12.2) required-check contract ─────────────────────
  # P1-6 (CI-IMPROVEMENT-ROADMAP, lib-11): the REAL mc1.12.2 E2E now runs
  # here — the placeholder stub is retired. mc1.12.2/test-infrastructure/
  # run-e2e.sh builds the lane, boots a real Forge 14.23.5.2847 server
  # with the mod, launches a HeadlessMC client (TestPlayer) under xvfb,
  # and asserts on the server log that the server booted, the client
  # joined, and the FML handshake mod-list line names everlastingskins.
  # Requires JDK 8 (FG 2.3.4 / Gradle 4.10.3 lane); the required-check
  # name `E2E (mc1.12.2)` is preserved verbatim for the contract.
  e2e-mc1_12_2:
    name: E2E (mc1.12.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [lint-yaml, changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.mc1_12_2 == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.buildSrc == 'true' ||
      needs.changes.outputs.gradle_infra == 'true' ||
      needs.changes.outputs.e2e_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin
      - name: Cache FG userdev blobs (stable, keyed on MC/Forge version)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches/minecraftforge
            ~/.gradle/caches/forge_gradle
            ~/.gradle/everlastingskins-vendored
          key: fg-userdev-${{ runner.os }}-mc1.12.2-1.12.2-14.23.5.2847
          restore-keys: |
            fg-userdev-${{ runner.os }}-mc1.12.2-
      - name: Cache Gradle wrapper and module deps (volatile, wrapper hash)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
          key: gradle-deps-${{ runner.os }}-mc1.12.2-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-mc1.12.2-
      - name: Cache E2E downloads (Forge installers, HeadlessMC, client profile)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/everlastingskins
            ~/.minecraft
            mc1.12.2/test-infrastructure/headlessmc
          key: e2e-mc1.12.2-${{ runner.os }}
          restore-keys: |
            e2e-mc1.12.2-${{ runner.os }}-
      - name: Run real mc1.12.2 E2E (server boot + headless client join)
        # CI-perf phase 1: step-level retry (nick-fields/retry@v3) inside the
        # same required check-run self-heals the documented infra-noise
        # signatures (Mavenizer 'Cache miss! Stacktrace for Information Only',
        # HttpTimeoutException, HTTP 429 — AGENTS.md lib-58 triage rule; the
        # E2E convention's exit code 2 = retryable infra). Retries reuse the
        # on-disk ~/.gradle state from the failed attempt, so they are warm.
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        with:
          timeout_minutes: 40
          max_attempts: 3
          retry_on: error
          command: bash mc1.12.2/test-infrastructure/run-e2e.sh mc1.12.2

  # ── E2E (forge-1.7.10 / forge-1.8.9 / forge-1.10.2) — informational ──
  # Slice-2 HeadlessMC bridge / in-jar-driver E2E (lib-12): informational,
  # NOT part of the required-check contract. Each lane's run-e2e.sh builds
  # the lane (Java 8, own wrapper), boots a real Forge server with the mod,
  # launches a HeadlessMC client (TestPlayer) with the lane's scenario, and
  # asserts the server-side ES_E2E_SKIN sentinel + the driver outcome.
  # Mesa software GL + xvfb for the headless client.
  e2e-headlessmc:
    name: E2E (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [lint-yaml, changes]
    # Always runs: job-level skip on a matrix registers one template-named
    # check-run, leaving the per-lane required contexts MISSING (BLOCKED).
    # Unselected legs skip every step and report success.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: forge-1.7.10
            filter-key: forge_1_7_10
            fgver: 1.7.10-10.13.4.1614
          - lane: forge-1.8.9
            filter-key: forge_1_8_9
            fgver: 1.8.9-11.15.1.2318
          - lane: forge-1.10.2
            filter-key: forge_1_10_2
            fgver: 1.10.2-12.18.3.2511
    steps:
      - name: Lane gate (skip-as-success for required checks)
        id: gate
        if: >-
          github.event_name == 'push' ||
          needs.changes.outputs[matrix.filter-key] == 'true' ||
          needs.changes.outputs.common == 'true' ||
          needs.changes.outputs.buildSrc == 'true' ||
          needs.changes.outputs.gradle_infra == 'true' ||
          needs.changes.outputs.e2e_infra == 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        if: steps.gate.outputs.run == 'true'
        with:
          java-version: "8"
          distribution: temurin
      - name: Install Mesa software GL + xvfb
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa libgl1-mesa-dri xvfb
      - name: Cache FG userdev blobs (stable, keyed on MC/Forge version)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: |
            ~/.gradle/caches/minecraftforge
            ~/.gradle/caches/forge_gradle
            ~/.gradle/everlastingskins-vendored
          key: fg-userdev-${{ runner.os }}-${{ matrix.lane }}-${{ matrix.fgver }}
          restore-keys: |
            fg-userdev-${{ runner.os }}-${{ matrix.lane }}-
      - name: Cache Gradle wrapper and module deps (volatile, wrapper hash)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
          key: gradle-deps-${{ runner.os }}-${{ matrix.lane }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-${{ matrix.lane }}-
      - name: Cache E2E downloads (Minecraft, Forge, HeadlessMC)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: |
            ~/.cache/everlastingskins
            ~/.minecraft
          key: e2e-${{ matrix.lane }}-${{ runner.os }}
          restore-keys: |
            e2e-${{ matrix.lane }}-${{ runner.os }}-
      - name: Run HeadlessMC E2E (bridge / in-jar driver)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        if: steps.gate.outputs.run == 'true'
        with:
          timeout_minutes: 40
          max_attempts: 3
          retry_on: error
          command: bash ${{ matrix.lane }}/test-infrastructure/run-e2e.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Upload E2E logs
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-logs-${{ matrix.lane }}
          path: |
            /tmp/everlastingskins-e2e/**/*.log
            /tmp/everlastingskins-e2e/**/e2e-result.json
          if-no-files-found: ignore

  # ── Config-order gate (informational) ─────────────────────────
  # Fail-fast guard for the :common-bundling regression class (PR #440
  # takes 1-2): structural grep guard against bare :common.sourceSets
  # from() forms in the convention + the CI-mirror probe
  # (--configure-on-demand --no-configuration-cache :forge-1.21:jar — the
  # exact shape that reproduced the sourceSets/WorkValidationException in
  # CI). INFORMATIONAL — not part of the required-check contract.
  # Offline handling: the probe runs WITHOUT --offline here (cold ~/.gradle
  # cannot resolve the settings-level foojay plugin / FG userdev graph —
  # run 31551098537); setup-gradle shares the Build jobs' cache key space
  # so the probe restores their cache. Local pre-push keeps --offline.
  config-order-gate:
    name: Config-order gate
    runs-on: ubuntu-24.04
    # 30 mirrors the Build matrix job budget: on a fully cold cache the
    # online probe does the same userdev resolution work as Build (1.21).
    timeout-minutes: 30
    needs: [lint-yaml, changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.forge_1_21 == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.buildSrc == 'true' ||
      needs.changes.outputs.gradle_infra == 'true' ||
      needs.changes.outputs.e2e_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          cache-provider: basic
      - name: Run config-order gate (structural guard + CI-mirror probe)
        run: bash scripts/config-order-gate.sh
        env:
          CONFIG_ORDER_OFFLINE: "0"

  # ── Vendored harness diff-guard (lib-12) ───────────────────────
  # Fails when a vendored SpecialSource harness lane (forge-1.6.4,
  # forge-1.5.2, forge-1.4.7) stops applying the shared harness script
  # (harness/specialsource-harness.gradle, Option B graduation), re-defines
  # a harness task locally, or drops a required harnessConfig key.
  # See scripts/ci-vendored-harness-diff-guard.sh.
  # ALWAYS-RUN: cheap contract job (gating policy — CI-perf phase 1 keeps
  # lint-yaml, aislop and this guard unconditional).
  vendored-harness-diff-guard:
    name: Vendored harness diff-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint-yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run vendored harness diff-guard
        run: bash scripts/ci-vendored-harness-diff-guard.sh

  # ── E2E (pre-1.8 real-client, informational) ──────────────────
  # Slice-1 real-client E2E for the vendored-harness pre-1.8 lanes
  # (lib-12). INFORMATIONAL — NOT part of the 22-context required-check
  # contract (no gh-api-bump); informational jobs never gate a merge.
  # All three lanes are LIVE: forge-1.6.4 (tweaker-model driver, slice-1
  # proven in #430) + forge-1.5.2 / forge-1.4.7 (merge-model driver: obf
  # client + universal.zip MERGED into the client jar, main
  # net.minecraft.client.Minecraft, CWD=gameDir, Minecraft.setServer
  # auto-connect at @Mod.Init — wrappers recovered from the #434 live
  # history and re-verified per-lane). Mesa software GL (llvmpipe) is
  # required for the pre-1.8 real-GL client; xvfb is preinstalled on
  # ubuntu-24.04.
  e2e-pre18:
    name: E2E (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [lint-yaml, changes]
    # Always runs (per-leg step gate): a job-level-skipped matrix would
    # register one template-named check-run and leave the per-lane required
    # contexts MISSING (BLOCKED). Unselected legs skip every step -> success.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: forge-1.6.4
            filter-key: forge_1_6_4
            fgver: 1.6.4-9.11.1.1345
          - lane: forge-1.5.2
            filter-key: forge_1_5_2
            fgver: 1.5.2-7.8.1.738
          - lane: forge-1.4.7
            filter-key: forge_1_4_7
            fgver: 1.4.7-6.6.2.534
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Lane gate (skip-as-success for required checks)
        id: gate
        if: >-
          github.event_name == 'push' ||
          needs.changes.outputs[matrix.filter-key] == 'true' ||
          needs.changes.outputs.common == 'true' ||
          needs.changes.outputs.buildSrc == 'true' ||
          needs.changes.outputs.gradle_infra == 'true' ||
          needs.changes.outputs.e2e_infra == 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        if: steps.gate.outputs.run == 'true'
        with:
          java-version: "8"
          distribution: temurin
      - name: Install Mesa software GL (llvmpipe for the real pre-1.8 client)
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 mesa-utils \
            libxrandr2 libxxf86vm1 libxcursor1 libxi6 libxinerama1 \
            libasound2t64 libopenal1 x11-xserver-utils
      - name: Cache FG userdev blobs (stable, keyed on MC/Forge version)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: |
            ~/.gradle/caches/minecraftforge
            ~/.gradle/caches/forge_gradle
            ~/.gradle/everlastingskins-vendored
          key: fg-userdev-${{ runner.os }}-${{ matrix.lane }}-${{ matrix.fgver }}
          restore-keys: |
            fg-userdev-${{ runner.os }}-${{ matrix.lane }}-
      - name: Cache Gradle wrapper and module deps (volatile, wrapper hash)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
          key: gradle-deps-${{ runner.os }}-${{ matrix.lane }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-${{ matrix.lane }}-
      - name: Cache E2E downloads (client jar, forge universal, libraries)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: ~/.cache/everlastingskins
          key: e2e-${{ matrix.lane }}-${{ runner.os }}
          restore-keys: |
            e2e-${{ runner.os }}-
      - name: Run real-client E2E (server boot + xvfb client + sentinel)
        # RUNNER_TMP must be a STEP env: the runner context is not available
        # in job-level env (invalid workflow file -> zero jobs on push). The
        # shared orchestrator (scripts/e2e/e2e-common.sh) reads it for the
        # server dir + result copy; the upload step below globs the same dir.
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        if: steps.gate.outputs.run == 'true'
        with:
          timeout_minutes: 40
          max_attempts: 3
          retry_on: error
          command: bash ${{ matrix.lane }}/test-infrastructure/run-e2e.sh
        env:
          RUNNER_TMP: ${{ runner.temp }}/everlastingskins-e2e
      - name: Upload E2E logs + result (always)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-${{ matrix.lane }}-logs
          path: |
            ${{ runner.temp }}/everlastingskins-e2e/e2e-result.json
            ${{ runner.temp }}/everlastingskins-e2e/**/*.log
          if-no-files-found: warn

