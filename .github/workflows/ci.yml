name: CI

on:
  push:
    branches: ["1.21", "mc1.12.2"]
  pull_request:
    branches: ["1.21", "mc1.12.2"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # ── Lint all YAML files once ───────────────────────────────────
  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          config_file: .yamllint.yml
          strict: true

  # ── Build & test on 1.21 (Java 21) ────────────────────────────
  build-121:
    name: Build (1.21)
    runs-on: ubuntu-latest
    needs: lint-yaml
    if: |
      (github.event_name == 'push' && github.ref_name == '1.21') ||
      (github.event_name == 'pull_request' && github.base_ref == '1.21')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-1.21-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-1.21-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify test count meets minimum
        run: |
          COUNT=$(grep -r "@Test" src/test/java/ | wc -l)
          echo "Test count: $COUNT"
          if [ "$COUNT" -lt 150 ]; then
            echo "ERROR: Test count dropped below 150 (got $COUNT)"
            exit 1
          fi
      - name: Build and test
        run: ./gradlew build test --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: mod-121
          path: build/libs/*.jar
          if-no-files-found: error

  # ── GameTest on 1.21 ─────────────────────────────────────────
  gametest-121:
    name: GameTest (1.21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-yaml
    if: |
      (github.event_name == 'push' && github.ref_name == '1.21') ||
      (github.event_name == 'pull_request' && github.base_ref == '1.21')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-1.21-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-1.21-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run GameTest (skin visibility packets)
        run: ./gradlew runGameTestServer --no-daemon --console=plain
        timeout-minutes: 15
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Dfile.encoding=UTF-8
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
            --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
            -Dio.netty.tryReflectionSetAccessible=true"
