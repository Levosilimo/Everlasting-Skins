name: CI

on:
  push:
    branches: ["integration/m2-monorepo", "main"]
  pull_request:
    branches: ["integration/m2-monorepo", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # ── Lint all YAML files once ───────────────────────────────────
  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          config_file: .yamllint.yml
          strict: true

  # ── Build matrix over the M2 modules (JDK 21) ──────────────────
  build:
    name: Build (${{ matrix.mc }})
    runs-on: ubuntu-latest
    needs: lint-yaml
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: common
            mc: common
          - module: forge-1.21
            mc: "1.21"
          - module: forge-1.21.1
            mc: "1.21.1"
          - module: forge-1.21.4
            mc: "1.21.4"
          - module: forge-1.21.8
            mc: "1.21.8"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-m2-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-m2-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify test count meets minimum
        run: |
          COUNT=$(grep -r "@Test" --include="*.java" common/src forge-1.21/src 2>/dev/null | wc -l)
          echo "Test count: $COUNT"
          if [ "$COUNT" -lt 150 ]; then
            echo "ERROR: Test count dropped below 150 (got $COUNT)"
            exit 1
          fi
      - name: Build module
        run: ./gradlew :${{ matrix.module }}:build --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: mod-${{ matrix.mc }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: warn

  # ── mc1.12.2 out-of-band lane (own wrapper, JDK 8) ─────────────
  build-mc1_12_2:
    name: Build (mc1.12.2)
    runs-on: ubuntu-latest
    needs: lint-yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-mc1.12.2-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-mc1.12.2-
      - name: Grant execute permission for gradlew
        run: chmod +x mc1.12.2/gradlew
      - name: Build and test
        run: cd mc1.12.2 && ./gradlew build --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: mod-mc1.12.2
          path: mc1.12.2/build/libs/*.jar
          if-no-files-found: warn

  # ── forge-1.16.5 out-of-band lane (own wrapper, JDK 8) ────────
  build-forge-1_16_5:
    name: Build (forge-1.16.5)
    runs-on: ubuntu-latest
    needs: lint-yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: "8"
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-forge-1.16.5-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-forge-1.16.5-
      - name: Grant execute permission for gradlew
        run: chmod +x forge-1.16.5/gradlew
      - name: Build and test
        run: cd forge-1.16.5 && ./gradlew build verifyNoMixin --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: mod-forge-1.16.5
          path: forge-1.16.5/build/libs/*.jar
          if-no-files-found: warn

  # ── forge-1.20.1 out-of-band lane (own wrapper, JDK 21) ────────
  build-forge-1_20_1:
    name: Build (forge-1.20.1)
    runs-on: ubuntu-latest
    needs: lint-yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-forge-1.20.1-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-forge-1.20.1-
      - name: Grant execute permission for gradlew
        run: chmod +x forge-1.20.1/gradlew
      - name: Build and test
        run: cd forge-1.20.1 && ./gradlew build verifyNoMixin --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: mod-forge-1.20.1
          path: forge-1.20.1/build/libs/*.jar
          if-no-files-found: warn

  # ── E2E (mc1.12.2) required-check contract ─────────────────────
  # The old per-branch required-check contract names `E2E (mc1.12.2)`
  # as a status context; keep that exact check name present on
  # integration/m2-monorepo (future-proofing, memory #1212). The real
  # HeadlessMC boot smoke runs on the mc1.12.2 branch; this lane runs
  # a minimal placeholder against forge-1.21, where the headlessmc
  # tests live in the M2 tree.
  e2e-mc1_12_2:
    name: E2E (mc1.12.2)
    runs-on: ubuntu-latest
    needs: lint-yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: 21
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Headless smoke placeholder
        run: |
          echo "headless smoke placeholder"
          ./gradlew :forge-1.21:tasks --no-daemon --console=plain

  # ── GameTest on 1.21 (canonical gametest subproject) ──────────
  gametest-121:
    name: GameTest (1.21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-m2-gametest-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-m2-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run GameTest (skin visibility packets)
        run: ./gradlew :forge-1.21:runGameTestServer --no-daemon --console=plain
        timeout-minutes: 15
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Dfile.encoding=UTF-8
            --add-opens=java.base/java.lang=ALL-UNNAMED
            --add-opens=java.base/java.nio=ALL-UNNAMED
            --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
            --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
            -Dio.netty.tryReflectionSetAccessible=true"

  # ── aislop quality gate (same scanner as the pre-commit hook) ─
  aislop:
    name: aislop (M2)
    runs-on: ubuntu-latest
    needs: lint-yaml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
      - name: Run aislop gate on PR changes
        run: npx -y aislop ci --changes --base origin/integration/m2-monorepo
