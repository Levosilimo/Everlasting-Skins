name: CI

on:
  push:
    branches: ["1.21", "mc1.12.2"]
  pull_request:
    branches: ["1.21", "mc1.12.2"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # ── Lint all YAML files once ───────────────────────────────────
  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          strict: true

  # ── Build & test on 1.21 (Java 21) ────────────────────────────
  build-121:
    name: Build (1.21)
    runs-on: ubuntu-latest
    needs: lint-yaml
    if: |
      (github.event_name == 'push' && github.ref_name == '1.21') ||
      (github.event_name == 'pull_request' && github.base_ref == '1.21')
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-1.21-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-1.21-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify test count meets minimum
        run: |
          COUNT=$(grep -r "@Test" src/test/java/ | wc -l)
          echo "Test count: $COUNT"
          if [ "$COUNT" -lt 150 ]; then
            echo "ERROR: Test count dropped below 150 (got $COUNT)"
            exit 1
          fi
      - name: Build and test
        run: ./gradlew build test --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-121
          path: build/libs/*.jar
          if-no-files-found: error

  # ── GameTest on 1.21 ─────────────────────────────────────────
  gametest-121:
    name: GameTest (1.21)
    runs-on: ubuntu-latest
    needs: lint-yaml
    if: |
      (github.event_name == 'push' && github.ref_name == '1.21') ||
      (github.event_name == 'pull_request' && github.base_ref == '1.21')
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-1.21-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-1.21-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run GameTest (skin visibility packets)
        run: ./gradlew runGameTestServer --no-daemon --console=plain
        timeout-minutes: 15

  # ── Build & test on mc1.12.2 (Java 8) ─────────────────────────
  build-1122:
    name: Build (mc1.12.2)
    runs-on: ubuntu-latest
    needs: lint-yaml
    if: |
      (github.event_name == 'push' && github.ref_name == 'mc1.12.2') ||
      (github.event_name == 'pull_request' && github.base_ref == 'mc1.12.2')
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-mc1.12.2-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-mc1.12.2-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew build test --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-1122
          path: build/libs/*.jar
          if-no-files-found: error
