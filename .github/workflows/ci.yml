name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # ── Lint all YAML files once ───────────────────────────────────
  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          config_file: .yamllint.yml
          strict: true
      - name: Check CI Mesa apt packages (t64 ALSA only)
        run: bash scripts/check-ci-mesa.sh

  # ── Build matrix over the M2 modules (JDK 21) ──────────────────
  build:
    name: Build (${{ matrix.mc }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout || 30 }}
    needs: lint-yaml
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: common
            mc: common
          - module: forge-1.21
            mc: "1.21"
          - module: forge-1.21.1
            mc: "1.21.1"
          - module: forge-1.21.4
            mc: "1.21.4"
          - module: forge-1.21.8
            mc: "1.21.8"
          - module: forge-26.2
            mc: "26.2"
            java: "25"
            timeout: 45   # heaviest: Java 25 + unobfuscated MC + FG 7.0.17
          - module: forge-26.1
            mc: "26.1"
            java: "25"
            timeout: 45   # heaviest: Java 25 + unobfuscated MC + FG 7.0.17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK ${{ matrix.java || '21' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: ${{ matrix.java || '21' }}
          distribution: temurin
      - name: Set up Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          cache-provider: basic
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify test count meets minimum
        # CI-IMPROVEMENT-ROADMAP P0-5: run once on the common leg instead of
        # once per matrix leg (8 identical greps today). Regex aligned with
        # scripts/test-count-gate.sh (@Test OR @ParameterizedTest).
        if: matrix.mc == 'common'
        run: |
          COUNT=$(grep -rE "@(Test|ParameterizedTest)\b" --include="*.java" common/src forge-1.21/src 2>/dev/null | wc -l)
          echo "Test count: $COUNT"
          if [ "$COUNT" -lt 150 ]; then
            echo "ERROR: Test count dropped below 150 (got $COUNT)"
            exit 1
          fi
      - name: Build module
        run: ./gradlew :${{ matrix.module }}:build --no-daemon --stacktrace --configure-on-demand
      - name: Upload built jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mod-${{ matrix.mc }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: warn

  # ── mc1.12.2 out-of-band lane (own wrapper, JDK 8) ─────────────
  build-mc1_12_2:
    name: Build (mc1.12.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
