# MC / Forge versions for the 26.2 lane
# NOTE: the 26.2 Forge line is 65.x — 62.0.x is the 26.1 branch. The
# coordinate `26.2-62.0.9` 404s on the Forge maven; 65.0.9 is the mature
# 65.0.x release (65.1.0 is the latest RB, not used here).
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
forge_version=65.0.9
forge_version_range=[65.0.9,66)

# Curse versions for this lane
curse_versions=26.2

# Java 25: Mojang ships Java 25 to end users in 26.1+, so the lane targets
# Java 25 (read by the forge-module convention's java.toolchain.version).
java.toolchain.version=25

# Minecraft 26.1+ ships unobfuscated: the convention's mappings("official")
# call is gated behind this property (default false keeps the 1.21.x
# modules on official mappings).
minecraft.unobfuscated=true

# Dev run directories (convention defaults)
mc.runDir=run
mc.runDir2=run2

# GameTest namespace for the data-driven GameTest scaffold (#292 pattern)
gametestNamespace=everlastingskins

# Mod identity (consumed by the convention + mods.toml)
mod_id=everlastingskins
mod_name=EverlastingSkins
mod_vendor=Levosilimo
mod_license=MIT License
mod_authors=Levosilimo
mod_version=2.1.0-beta.1
mixin_id=everlastingskins
