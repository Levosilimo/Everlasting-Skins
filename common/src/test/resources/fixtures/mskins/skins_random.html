<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Skins Minecraft - random skins by nickname</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://mskins.net/themes/mc/assets/css/style.min.css?1.0.83">
</head>
<body>

<header>
<div class="navbar-fixed">
    <nav id="navbar" class="z-depth-3 green nav-extended">
        <div class="nav-wrapper">
            <a href="#" data-target="slide-out" class="button-collapse sidenav-trigger"><i class="material-icons">menu</i></a>
            <a href="https://mskins.net/ru" class="brand-logo">skins</a>
            <form action="https://mskins.net/ru/search" method="get" id="home-search" class="nav-search-bar" accept-charset="utf-8">
                <div class="hm-sb input-field">
                    <input id="search-bar" name="q" class="hoverable" placeholder="Search..." type="search" maxlength="16" autocomplete="off">
                </div>
            </form>
        </div>
    </nav>
</div>
</header>

<main>
<div class="container mb30">

<div class="h-wrap section">
    <h4 class="h-title green-text">Random skins</h4>
    <p class="grey-text">Random Minecraft skins by nickname.</p>
</div>

<div class="row">

    <div class="col l3 m6 s12">
        <div class="card card-main item  hoverable">
            <div class="card-image card-skin grey lighten-5 waves-effect waves-block waves-light">
                <a class="skin_link" href="https://mskins.net/ru/skin/Notch-AAAAA">
                    <img class="item-img" width="212" height="350" src="/uploads/preview3d/00/00/Notch_350.png" alt="Minecraft skin by nickname Notch">
                </a>
            </div>
            <div class="card-content">
                <span class="card-title green-text truncate">Notch</span>
                <a class="btn-floating halfway-fab waves-effect waves-light green item-btn-copy tooltipped-click" data-clipboard-text="Notch" data-position="top" data-delay="50" data-tooltip="Copy nickname"><i class="material-icons">content_copy</i></a>
            </div>
            <div class="card-action">
                <span class="item-res grey-text">
                    <span class="numb">64x64</span>
                </span>
                <span class="item-count grey-text right">
                    <i class="material-icons">visibility</i>
                    <span class="numb">56</span>
                </span>
            </div>
        </div>
    </div>

    <div class="col l3 m6 s12">
        <div class="card card-main item  hoverable">
            <div class="card-image card-skin grey lighten-5 waves-effect waves-block waves-light">
                <a class="skin_link" href="https://mskins.net/ru/skin/Jeb_-BBBBB">
                    <img class="item-img" width="212" height="350" src="/uploads/preview3d/11/11/Jeb__350.png" alt="Minecraft skin by nickname Jeb_">
                </a>
            </div>
            <div class="card-content">
                <span class="card-title green-text truncate">Jeb_</span>
                <a class="btn-floating halfway-fab waves-effect waves-light green item-btn-copy tooltipped-click" data-clipboard-text="Jeb_" data-position="top" data-delay="50" data-tooltip="Copy nickname"><i class="material-icons">content_copy</i></a>
            </div>
            <div class="card-action">
                <span class="item-res grey-text">
                    <span class="numb">64x64</span>
                </span>
                <span class="item-count grey-text right">
                    <i class="material-icons">visibility</i>
                    <span class="numb">59</span>
                </span>
            </div>
        </div>
    </div>

    <div class="col l3 m6 s12">
        <div class="card card-main item item-promo">
            <div class="item_ad">
                <div class="center-align">
                    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8794966854388692" crossorigin="anonymous"></script>
                </div>
            </div>
            <div class="card-image">
                <img class="item-img" width="212" height="350" src="https://mskins.net/themes/mc/assets/img/blank.webp">
            </div>
            <div class="card-content">
                <span class="card-title green-text truncate">ad</span>
            </div>
            <div class="card-action">
                <span class="item-res grey-text">
                    <span class="numb">#</span>
                </span>
            </div>
        </div>
    </div>

    <div class="col l3 m6 s12">
        <div class="card card-main item  hoverable">
            <div class="card-image card-skin grey lighten-5 waves-effect waves-block waves-light">
                <a class="skin_link" href="https://mskins.net/ru/skin/Dinnerbone-CCCCC">
                    <img class="item-img" width="212" height="350" src="/uploads/preview3d/22/22/Dinnerbone_350.png" alt="Minecraft skin by nickname Dinnerbone">
                </a>
            </div>
            <div class="card-content">
                <span class="card-title green-text truncate">Dinnerbone</span>
                <a class="btn-floating halfway-fab waves-effect waves-light green item-btn-copy tooltipped-click" data-clipboard-text="Dinnerbone" data-position="top" data-delay="50" data-tooltip="Copy nickname"><i class="material-icons">content_copy</i></a>
            </div>
            <div class="card-action">
                <span class="item-res grey-text">
                    <span class="numb">64x64</span>
                </span>
                <span class="item-count grey-text right">
                    <i class="material-icons">visibility</i>
                    <span class="numb">143</span>
                </span>
            </div>
        </div>
    </div>

</div>

<ul class="pagination center-align">
    <li class="disabled"><a href="#!"><i class="material-icons">chevron_left</i></a></li>
    <li class="active green"><a href="#!">1</a></li>
    <li class="waves-effect"><a href="#!">2</a></li>
    <li class="waves-effect"><a href="#!"><i class="material-icons">chevron_right</i></a></li>
</ul>

</div>
</main>

<footer class="page-footer green">
    <div class="container">
        <div class="row">
            <div class="col l6 s12">
                <h5 class="white-text">Skins</h5>
                <p class="grey-text text-lighten-4">Minecraft skins by nickname.</p>
            </div>
        </div>
    </div>
</footer>

</body>
</html>
