// forge-1.4.7 — standalone vendored-deobf build for the Minecraft 1.4.7 lane.
//
// LANE SEPARATION (out-of-band, per monorepo doctrine): this lane cannot use
// any ForgeGradle. FG 1.2.11 is impossible (forge major 6 sits below its
// floor of major 7; see plan-forge-1-4-7-port.json). So the lane toolchain IS
// the vendored remap harness proven by the 0.5-day SpecialSource spikes
// (feature/lane-forge-1.6.4-vendored-spike 3d30c29, then
// feature/lane-forge-1.5.2-vendored-spike): remap-only (SpecialSource 1.7.4
// bytecode remapping against the MCP 7.26a conf bundled in the forge src
// zip), no decompiler, no FG, no jitpack, no archive.org. This build is its
// own wrapper (Gradle 4.4.1, Java 8 ONLY), never included in
// settings.gradle.kts, no buildSrc, no `everlastingskins.forge-module`
// convention, no dependency-analysis (out-of-band policy, same as
// forge-1.6.4 / forge-1.5.2 / forge-1.7.10 / forge-1.8.9 / mc1.12.2).
//
// The vendored SpecialSource harness itself lives ONCE in
// ../harness/specialsource-harness.gradle (lib-12 Option B graduation) and
// is consumed via `apply from:` below (in-repo precedent:
// mc1.12.2/build.gradle:166). This file carries only the per-lane
// harnessConfig (vendoredInputs, mcpVersion, mergeOrder, subclassExpansion,
// nameDomainTokens, testRuntimeDeps) and the lane-specific prose below.
//
// NAME DOMAINS (empirical, spike-verified against the piston server jar):
//   - production runtime = OBFUSCATED. minecraft_server.1.4.7.jar ships
//     proguard names: root-package classes (`di` = Packet250CustomPayload,
//     ...) EXCEPT identity classes like net/minecraft/server/MinecraftServer
//     which keep their names; members are always obf (MinecraftServer.D() =
//     getServer, Packet250CustomPayload field `a` = channel). FML 4.7 has no
//     deobfuscating remapper in production, so the shipped mod jar MUST be
//     reobfuscated to this domain.
//   - MCP 7.26a conf (bundled in forge-1.4.7-6.6.2.534-src.zip at
//     forge/fml/conf/, version.cfg asserts MCPVersion=7.26a): joined.srg CL
//     lines map obf-class -> srg-class (net/minecraft/src/*); MD lines key by
//     (obf-owner, obf-method, OBF-desc); FD lines key by (obf-owner,
//     obf-field). 7.26a joined.srg has NO #C/#S side tags (0 matches,
//     verified in the spike). methods.csv/fields.csv map func_/field_ ->
//     readable deobf names; the 7.26a CSVs have NO notch column
//     (searge,name,side,desc) — the harness only reads the first two columns,
//     so the shape is a no-op.
//   - 1.4.7 universal naming quirk: the compiled FML 4.7 + Forge 6.x artifact
//     is universal.ZIP (actually a JAR — PK header); universal.jar 404s
//     (verified live by lib-7, same as 1.5.2). It is OBF-DOMAIN too (single
//     obf->deobf leg for both jars). It ALSO carries 4 patched MC classes
//     (patched MinecraftServer 28,247 B vs the vanilla server's, plus 3
//     client additions) — the merge step must let universal's patched copies
//     OVERRIDE the server jar's originals (spike MERGE RULE delta, same as
//     the 1.5.2 spike → mergeOrder=universalFirst).
//   - dev classpath = build/deobf/merged-deobf.jar (server.jar obf->deobf +
//     universal.zip obf->deobf, merged, universal wins collisions). Ship
//     artifact = the mod jar reobf'd deobf->obf (composite: csv reverse +
//     joined.srg reverse).
//
// FML 4.7.35 surface (vs 5.2 on 1.5.2 / 7.x on 1.6.4): same pre-1.6
// lifecycle markers (`@Mod` + `@Mod.Init`, verified Mod$Init.class in the
// universal zip) and NetworkRegistry.instance().registerChannel(...) — the
// 1.6.4/1.5.2 adapter's touchpoints carry over unchanged.

plugins {
    id 'java'
}

ext {
    harnessConfig = [
        // Vendored inputs (resolveVendored): forge src zip (bundles the MCP
        // 7.26a conf), forge universal zip, vanilla 1.4.7 server jar.
        vendoredInputs: [
            [name: 'forge-1.4.7-6.6.2.534-src.zip',
             url: 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.4.7-6.6.2.534/forge-1.4.7-6.6.2.534-src.zip',
             algo: 'MD5', digest: '3d98a02d38afca25266e925126348466'],
            // NAMING QUIRK (reversed vs 1.6.4): the compiled FML 4.7 + Forge
            // 6.x artifact is universal.ZIP (actually a JAR — PK header);
            // universal.jar 404s (verified live by lib-7, same as 1.5.2).
            [name: 'forge-1.4.7-6.6.2.534-universal.zip',
             url: 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.4.7-6.6.2.534/forge-1.4.7-6.6.2.534-universal.zip',
             algo: 'MD5', digest: '736ee1f4869413922f639cfad6260133'],
            [name: 'minecraft_server.1.4.7.jar',
             url: 'https://piston-data.mojang.com/v1/objects/2f0ec8efddd2f2c674c77be9ddb370b727dec676/server.jar',
             algo: 'SHA-1', digest: '2f0ec8efddd2f2c674c77be9ddb370b727dec676'],
            // Joint client-side jar (lib-5 design, PR #422): the mod is no
            // longer serverSideOnly — the same jar carries a client packet
            // handler that injects skin PNGs into the era renderer. The vanilla
            // CLIENT jar is vendored + deobf'd (harness clientInput) and added
            // to the compile classpath after the server-first merged jar.
            // sha1 verified against launcher.mojang.com version_manifest 1.4.7
            // (downloads.client.sha1).
            [name: 'minecraft_client.1.4.7.jar',
             url: 'https://launcher.mojang.com/v1/objects/53ed4b9d5c358ecfff2d8b846b4427b888287028/client.jar',
             algo: 'SHA-1', digest: '53ed4b9d5c358ecfff2d8b846b4427b888287028'],
        ],
        mcpVersion: '7.26a',
        archiveBaseName: 'everlastingskins-1.4.7',
        mergeOrder: 'universalFirst',  // fork #1: universal carries 4 patched MC classes that must win
        subclassExpansion: true,       // fork #2: javac receiver-owner reobf fix (cloned from 1.5.2)
        nameDomainTokens: [            // fork #3: assertNameDomain forbidden set
            'func_', 'field_', 'net/minecraft/src/',
            'net/minecraft/server/MinecraftServer.getServer',
            'Packet250CustomPayload.channel',
            'getCommandSenderName',
            'getConfigurationManager',
            'net/minecraft/server/MinecraftServer.getFile',
            'playerNetServerHandler',
            'netManager',
            'playerEntityList',
        ],
        // fork #4: test-runtime log4j-core match for log4j-api 2.8.1
        // (authlib 1.5.16 transitively pulls log4j-core:2.0-beta9, whose
        // Log4jContextFactory mismatches — AbstractMethodError at test
        // runtime; backported from the forge-1.5.2 lane fix, commit 04c18ee).
        testRuntimeDeps: ['org.apache.logging.log4j:log4j-core:2.8.1'],
    ]
}

apply from: '../harness/specialsource-harness.gradle'
// ---------------------------------------------------------------------------
// RUNTIME-COMPAT FIX (slice-1 E2E discovery, mirrored from the 1.6.4 lane):
// FML 4.7 reads mod-jar classes with its bundled ASM 4.0 (from the FML lib
// dir), which refuses class files above major version 51 (Java 7). A
// Java-8-targeted jar is therefore rejected wholesale at boot ("Unable to
// read a class file correctly ... probably a corrupt zip" — observed live
// 2026-08-11 against forge-1.4.7-6.6.2.534). The mod must compile against
// Java 8 APIs (javac 8 forbids source-8 → target-7, and :common uses
// lambdas/streams), so the shipped jar's class files are downgraded to major
// 51 in place AFTER reobf. The production 1.5.2 runtime (like the E2E) is
// Java 8, so the bytecode — including invokedynamic for :common lambdas —
// executes unchanged; only the version stamp changes.
// ---------------------------------------------------------------------------
task downgradeClassVersion(dependsOn: reobf) {
    group = 'everlastingskins'
    description = 'Rewrite class-file major version 52 -> 51 in the reobf\'d jar (FML 4.7 ASM cannot read Java 8 class files).'
    inputs.file jar.archivePath
    outputs.file jar.archivePath
    doLast {
        def jarFile = jar.archivePath
        def tmp = file("${jarFile}.v51")
        def zin = new java.util.zip.ZipFile(jarFile)
        int downgraded = 0
        def zout = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tmp)))
        try {
            zin.entries().each { entry ->
                if (entry.isDirectory()) {
                    zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    zout.closeEntry()
                    return
                }
                def bytes = zin.getInputStream(entry).bytes
                if (entry.name.endsWith('.class') && bytes.length > 8) {
                    int major = ((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF)
                    if (major > 51) {
                        bytes[6] = 0
                        bytes[7] = 51
                        downgraded++
                    }
                }
                zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                zout.write(bytes)
                zout.closeEntry()
            }
        } finally {
            zout.close()
            zin.close()
        }
        if (!jarFile.delete()) throw new GradleException("downgradeClassVersion: could not delete ${jarFile}")
        if (!tmp.renameTo(jarFile)) throw new GradleException("downgradeClassVersion: could not replace ${jarFile}")
        logger.lifecycle("downgradeClassVersion: ${downgraded} class files rewritten to major 51 (Java 7) in ${jarFile.name}")
    }
}
// The name-domain self-check javap's the jar — must see the final artifact.
assertNameDomain.dependsOn downgradeClassVersion
// E2E slice 1: the shared sentinel PNG (:common test resources, canonical at
// common/src/test/resources/e2e/sentinel-64x32.png) is mirrored onto the
// lane's test resources (same pattern as the main source-dir share). The
// e2e scripts read the canonical copy straight from the repo path; the
// classpath copy lets the lane's tests assert the pixel contract of the
// exact bytes the live run injects.
sourceSets {
    test {
        resources {
            srcDir '../common/src/test/resources'
        }
    }
}
