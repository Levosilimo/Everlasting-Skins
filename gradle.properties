org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Maven coordinates + mod identity (shared by every module)
group=levosilimo.everlastingskins
mod_id=everlastingskins
mod_version=2.1.0
mod_name=EverlastingSkins
mod_vendor=Levosilimo
mod_license=MIT
mod_group_id=levosilimo.everlastingskins
mod_authors=Levosilimo
mod_description=Server-side persistent custom skins on pure Forge servers — no client mod required.

# Toolchain: forge modules build with Java 21; :common compiles --release 8
# against the same toolchain (see common/build.gradle.kts).
java.toolchain.version=21

# Forge loader version range (same for every forge-* module)
loader_version_range=[31,)

# Mixins (annotation processor + jar manifest only; no mixingradle plugin)
mixin_id=everlastingskins

# CurseForge project (same mod across versions)
curse_project=538149
