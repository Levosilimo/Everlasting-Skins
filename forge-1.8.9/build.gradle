 *
 * forge-1.8.9 out-of-band lane (Minecraft 1.8.9 / Forge 11.15.1.2318 /
 * ForgeGradle 2.1-SNAPSHOT / MCP stable_20 / Java 8). Self-contained build:
 * own Gradle 4.10.3 wrapper, NOT in settings.gradle.kts, no buildSrc.
 * Build with: cd forge-1.8.9 && JAVA_HOME=<jdk8> ./gradlew build
 */

buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://files.minecraftforge.net/maven' }
        maven { name = 'sonatype'; url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        // Rule 4 lane decision: FG 2.1-SNAPSHOT is the classic 1.8.9
        // ForgeGradle line (verified on files.minecraftforge.net/maven,
        // latest snapshot build 2.1-20211118.174922-42). Same classpath
        // shape as the proven mc1.12.2 lane (FG 2.3.4) buildscript.
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "${mod_version}"
group = 'levosilimo.everlastingskins'
archivesBaseName = 'everlastingskins-1.8.9'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    // Combined MC-Forge string (FG 2.x DSL — NOT the FG 5.x two-arg form).
    // 1.8.9 builds >= 11.15.1.1875 exist on the forge maven only in the
    // double-suffixed form '<mc>-<forge>-<mc>' (maven.minecraftforge.net
    // metadata, verified 2026-08-07); the plain '<mc>-<forge>' string 404s.
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    // Bare-string MCP channel (FG 2.x DSL). stable_20 was designed for
    // 1.8.8; FG emits a benign 'designed for 1.8.8' warning — expected.
    mappings = 'stable_20'
    replace '@VERSION@', project.version
    // NOTE: FG 2.1-SNAPSHOT has no standardForgeFixes property (added in
    // later FG 2.x); 1.8.9 deobf works without it.
}

repositories {
    mavenCentral()
}

// :common consumed by source-dir share (Rule 1: :common is canonical; the
// lane never carries a duplicate copy). Same mechanism as mc1.12.2 — no
// JPMS on Java 8. No mixin/ exclude needed: :common has no mixin package
// and the inline verifyNoMixin gate below scans the shared roots anyway.
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../common/src/main/java'
        }
    }
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': archivesBaseName,
            'Specification-Vendor': 'Levosilimo',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Levosilimo'
        ])
    }
}

// --- no-mixin gate (inlined; the root buildSrc no-mixin.gradle.kts does
// not apply to out-of-band lanes) ---
// Oracle fix (three-lane review): HEAVIER variant — scans the lane's build
// files AND every source root (incl. the shared :common sources) for Mixin
// usage. The lighter mc1.12.2 exclude-only approach does not scan build
// files for `mixin {}` blocks / mixins.json bundling, so it is not used.
// Banned strings are assembled from parts so this file never contains the
// literal strings it scans for. Everything lives inside the doLast closure:
// script-level defs are not visible to task actions in Groovy.

task verifyNoMixin {
    group = 'verification'
    description = 'Fails the build if any Mixin usage is detected: annotations, mixingradle, mixin plugin id, mixin {} blocks, or mixins.json bundling.'
    doLast {
        def bannedLiterals = [
            'mixingradle coordinate': 'org.spongepowered' + ':mixingradle',
            'mixin plugin id'       : 'org.spongepowered' + '.mixin',
            'mixin config bundling' : 'everlastingskins' + '.mixins.json',
        ]

        def bannedPatterns = [
            // Pattern assembled from parts so this file never contains the
            // literal scanned string (same trick as the Kotlin original).
            'Mixin annotation': ~/${"@"}Mixin\b/,
            'mixin block'     : ~/^\s*mixin\s*\{/,
        ]

        def scanFile = { File file, List<String> offenders ->
            if (!file.isFile()) return
            String text = file.getText('UTF-8')
            String rel = projectDir.toPath().relativize(file.toPath()).toString()
            bannedLiterals.each { label, literal ->
                if (text.contains(literal)) {
                    offenders << "$rel: $label reference ('$literal')"
                }
            }
            bannedPatterns.each { label, pattern ->
                def matcher = pattern.matcher(text)
                while (matcher.find()) {
                    int line = text.substring(0, matcher.start()).count('\n') + 1
                    offenders << "$rel: $label at line $line"
                }
            }
        }

        List<String> offenders = []
        File projectDir = project.projectDir
        List<File> buildFiles = [
            new File(projectDir, 'build.gradle'),
            new File(projectDir, 'settings.gradle'),
            new File(projectDir, 'gradle.properties'),
        ].findAll { it.isFile() }
        Set<File> sourceRoots = sourceSets.collectMany { it.allSource.srcDirs }.findAll { it.exists() }
        sourceRoots.each { root ->
            root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name.endsWith('.java') || f.name.endsWith('.json') || f.name.endsWith('.properties')) {
                    scanFile(f, offenders)
                }
            }
        }
        buildFiles.each { scanFile(it, offenders) }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                'Mixin policy violated:\n' + offenders.join('\n') +
                '\n\nMixin policy: the lane contains ZERO Mixin usage. ' +
                'If a lane requires Mixin support, fork the lane - it is a sign ' +
                'that should not happen in the shared core.')
        }
        logger.lifecycle('Mixin check passed: zero Mixin annotations, zero mixingradle references.')
    }
}

build.dependsOn verifyNoMixin
