// forge-1.5.2 — standalone vendored-deobf build for the Minecraft 1.5.2 lane.
//
// LANE SEPARATION (out-of-band, per monorepo doctrine): this lane cannot use
// any ForgeGradle. The spike verdict (spike-1-5-2-toolchain.json, 2026-08-09)
// verified empirically that GTNH FG 1.2.11 rejects forge 7.8.1.738 at
// configuration time (doVersionChecks gate: min 10.12.0.1048 '1.7', max
// 11.14.3.1503 '1.8'), MCP-Archive has zero 1.5.2 channels, and
// de.oceanlabs.mcp:mcp:1.5.2 404s on the Forge maven. So the lane toolchain IS
// the vendored remap harness proven by the 0.5-day SpecialSource spike
// (feature/lane-forge-1.5.2-vendored-spike): remap-only (SpecialSource 1.7.4
// bytecode remapping against the MCP 7.51 conf bundled in the forge src zip),
// no decompiler, no FG, no jitpack, no archive.org. This build is its own
// wrapper (Gradle 4.4.1, Java 8 ONLY), never included in settings.gradle.kts,
// no buildSrc, no `everlastingskins.forge-module` convention, no
// dependency-analysis (out-of-band policy, same as forge-1.6.4 /
// forge-1.7.10 / forge-1.8.9 / mc1.12.2).
//
// The vendored SpecialSource harness itself lives ONCE in
// ../harness/specialsource-harness.gradle (lib-12 Option B graduation) and
// is consumed via `apply from:` below (in-repo precedent:
// mc1.12.2/build.gradle:166). This file carries only the per-lane
// harnessConfig (vendoredInputs, mcpVersion, mergeOrder, subclassExpansion,
// nameDomainTokens, testRuntimeDeps) and the lane-specific prose below.
//
// NAME DOMAINS (empirical, spike-verified against the piston server jar and
// the universal zip):
//   - production runtime = OBFUSCATED. minecraft_server.1.5.2.jar ships
//     proguard names: root-package classes (`dk` = Packet250CustomPayload,
//     `gv` = IServer, ...) EXCEPT identity classes like
//     net/minecraft/server/MinecraftServer which keep their names; members
//     are always obf (MinecraftServer.D() = getServer, MinecraftServer.f =
//     logInfo, Packet250CustomPayload field `a` = channel). FML 5.2 has no
//     deobfuscating remapper in production, so the shipped mod jar MUST be
//     reobfuscated to this domain.
//   - MCP 7.51 conf (bundled in forge-1.5.2-7.8.1.738-src.zip at
//     forge/fml/conf/, version.cfg asserts MCPVersion = 7.51): joined.srg CL
//     lines map obf-class -> srg-class (net/minecraft/src/*); MD lines key by
//     (obf-owner, obf-method, OBF-desc); FD lines key by (obf-owner,
//     obf-field). 7.51 joined.srg has NO #C/#S side tags (0 matches, verified
//     in the spike). methods.csv/fields.csv map func_/field_ -> readable deobf
//     names; the 7.51 CSVs have NO notch column (searge,name,side,desc) — the
//     harness only reads the first two columns, so the shape is a no-op.
//   - 1.5.2 universal naming quirk: the compiled FML 5.2 + Forge artifact is
//     universal.ZIP (actually a JAR — PK header); universal.jar 404s (the
//     naming quirk is REVERSED vs 1.6.4). It is OBF-DOMAIN too (single
//     obf->deobf leg for both jars). It ALSO carries 4 patched MC classes
//     (patched MinecraftServer 28,191 B vs the vanilla 18,709 B, plus 3
//     client additions) — the merge step must let universal's patched copies
//     OVERRIDE the server jar's originals (spike MERGE RULE delta →
//     mergeOrder=universalFirst).
//   - dev classpath = build/deobf/merged-deobf.jar (server.jar obf->deobf +
//     universal.zip obf->deobf, merged, universal wins collisions). Ship
//     artifact = the mod jar reobf'd deobf->obf (composite: csv reverse +
//     joined.srg reverse).
//
// FML 5.2 surface (vs 7.x on 1.6.4): near-match for this mod's touchpoints —
// `@Mod(modid,name,version)` + `@Mod.EventHandler`, and
// NetworkRegistry.instance().registerChannel(IPacketHandler,String) are the
// SAME API (FML 5.2 NetworkRegistry.java:99-120), so the 1.6.4 adapter's
// programmatic channel path carries over unchanged.

plugins {
    id 'java'
}

ext {
    harnessConfig = [
        // Vendored inputs (resolveVendored): forge src zip (bundles the MCP
        // 7.51 conf), forge universal zip, vanilla 1.5.2 server jar.
        vendoredInputs: [
            [name: 'forge-1.5.2-7.8.1.738-src.zip',
             url: 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.5.2-7.8.1.738/forge-1.5.2-7.8.1.738-src.zip',
             algo: 'MD5', digest: '82d0c238e13dda7b62d7c9ebb8714866'],
            // NAMING QUIRK (reversed vs 1.6.4): the compiled FML 5.2 + Forge
            // artifact is universal.ZIP (actually a JAR — PK header);
            // universal.jar 404s.
            [name: 'forge-1.5.2-7.8.1.738-universal.zip',
             url: 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.5.2-7.8.1.738/forge-1.5.2-7.8.1.738-universal.zip',
             algo: 'MD5', digest: '8889a0e9fa22a71f4dfa63aab16c495b'],
            [name: 'minecraft_server.1.5.2.jar',
             url: 'https://launcher.mojang.com/v1/objects/f9ae3f651319151ce99a0bfad6b34fa16eb6775f/server.jar',
             algo: 'SHA-1', digest: 'f9ae3f651319151ce99a0bfad6b34fa16eb6775f'],
            // Joint client-side jar (lib-5 design, PR #422): the mod is no
            // longer serverSideOnly — the same jar carries a client packet
            // handler that injects skin PNGs into the era renderer. The vanilla
            // CLIENT jar is vendored + deobf'd (harness clientInput) and added
            // to the compile classpath after the server-first merged jar.
            // sha1 verified against launcher.mojang.com version_manifest 1.5.2
            // (downloads.client.sha1).
            [name: 'minecraft_client.1.5.2.jar',
             url: 'https://launcher.mojang.com/v1/objects/465378c9dc2f779ae1d6e8046ebc46fb53a57968/client.jar',
             algo: 'SHA-1', digest: '465378c9dc2f779ae1d6e8046ebc46fb53a57968'],
        ],
        mcpVersion: '7.51',
        archiveBaseName: 'everlastingskins-1.5.2',
        mergeOrder: 'universalFirst',  // fork #1: universal carries 4 patched MC classes that must win
        subclassExpansion: true,       // fork #2: javac receiver-owner reobf fix (original author)
        nameDomainTokens: [            // fork #3: assertNameDomain forbidden set
            'func_', 'field_', 'net/minecraft/src/',
            'net/minecraft/server/MinecraftServer.getServer',
            'Packet250CustomPayload.channel',
            'getCommandSenderName',
            'getConfigurationManager',
            'net/minecraft/server/MinecraftServer.getFile',
            'playerNetServerHandler',
            'netManager',
            'playerEntityList',
        ],
        // fork #4: test-runtime log4j-core match for log4j-api 2.8.1
        // (authlib 1.5.16 transitively pulls log4j-core:2.0-beta9, whose
        // Log4jContextFactory mismatches — 23 test failures, 2026-08-09,
        // build #1).
        testRuntimeDeps: ['org.apache.logging.log4j:log4j-core:2.8.1'],
    ]
}

apply from: '../harness/specialsource-harness.gradle'

// ---------------------------------------------------------------------------
// RUNTIME-COMPAT FIX (slice-1 E2E discovery, mirrored from the 1.6.4 lane):
// FML 5.2 reads mod-jar classes with its bundled ASM 4.1 (from the FML lib
// dir), which refuses class files above major version 51 (Java 7). A
// Java-8-targeted jar is therefore rejected wholesale at boot ("Unable to
// read a class file correctly ... probably a corrupt zip" — observed live
// 2026-08-11 against forge-1.5.2-7.8.1.738). The mod must compile against
// Java 8 APIs (javac 8 forbids source-8 → target-7, and :common uses
// lambdas/streams), so the shipped jar's class files are downgraded to major
// 51 in place AFTER reobf. The production 1.5.2 runtime (like the E2E) is
// Java 8, so the bytecode — including invokedynamic for :common lambdas —
// executes unchanged; only the version stamp changes.
// ---------------------------------------------------------------------------
task downgradeClassVersion(dependsOn: reobf) {
    group = 'everlastingskins'
    description = 'Rewrite class-file major version 52 -> 51 in the reobf\'d jar (FML 5.2 ASM cannot read Java 8 class files).'
    inputs.file jar.archivePath
    outputs.file jar.archivePath
    doLast {
        def jarFile = jar.archivePath
        def tmp = file("${jarFile}.v51")
        def zin = new java.util.zip.ZipFile(jarFile)
        int downgraded = 0
        def zout = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tmp)))
        try {
            zin.entries().each { entry ->
                if (entry.isDirectory()) {
                    zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    zout.closeEntry()
                    return
                }
                def bytes = zin.getInputStream(entry).bytes
                if (entry.name.endsWith('.class') && bytes.length > 8) {
                    int major = ((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF)
                    if (major > 51) {
                        bytes[6] = 0
                        bytes[7] = 51
                        downgraded++
                    }
                }
                zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                zout.write(bytes)
                zout.closeEntry()
            }
        } finally {
            zout.close()
            zin.close()
        }
        if (!jarFile.delete()) throw new GradleException("downgradeClassVersion: could not delete ${jarFile}")
        if (!tmp.renameTo(jarFile)) throw new GradleException("downgradeClassVersion: could not replace ${jarFile}")
        logger.lifecycle("downgradeClassVersion: ${downgraded} class files rewritten to major 51 (Java 7) in ${jarFile.name}")
    }
}
// The name-domain self-check javap's the jar — must see the final artifact.
assertNameDomain.dependsOn downgradeClassVersion

// ---------------------------------------------------------------------------
// fork #5 (1.5.2 dev-classpath quirk): the merged dev jar carries the
// universal leg's CreativeTabs whose clinit calls `CreativeTabSearch.a(String)`
// (the invokevirtual receiver-owner rename missed that call site during the
// obf->deobf leg — the declaration became setBackgroundImageName but the call
// site kept the obf name), while the server leg's CreativeTabSearch is a bare
// stub. Any MC registry static-init chain (Block -> CreativeTabs) therefore
// throws NoSuchMethodError in a test JVM, which blocks ConfigTest's
// Configuration load() round-trip (Configuration sizes a static field off
// Item.itemsList, forcing the registry init). The CLIENT jar is the
// self-consistent leg for these classes (vanilla readable domain, full
// CreativeTabSearch), so the client-deobf jar is prepended to the TEST
// classpath only — the compile classpath and the shipped (reobf'd) jar are
// untouched, and the assertNameDomain gate still sees the production domain.
def testClientDeobfLeg = files('build/deobf/client-deobf.jar')
test {
    classpath = testClientDeobfLeg + classpath
}
