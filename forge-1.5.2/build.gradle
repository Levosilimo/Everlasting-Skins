// forge-1.5.2 — standalone vendored-deobf build for the Minecraft 1.5.2 lane.
//
// LANE SEPARATION (out-of-band, per monorepo doctrine): this lane cannot use
// any ForgeGradle. The spike verdict (spike-1-5-2-toolchain.json, 2026-08-09)
// verified empirically that GTNH FG 1.2.11 rejects forge 7.8.1.738 at
// configuration time (doVersionChecks gate: min 10.12.0.1048 '1.7', max
// 11.14.3.1503 '1.8'), MCP-Archive has zero 1.5.2 channels, and
// de.oceanlabs.mcp:mcp:1.5.2 404s on the Forge maven. So the lane toolchain IS
// the vendored remap harness proven by the 0.5-day SpecialSource spike
// (feature/lane-forge-1.5.2-vendored-spike): remap-only (SpecialSource 1.7.4
// bytecode remapping against the MCP 7.51 conf bundled in the forge src zip),
// no decompiler, no FG, no jitpack, no archive.org. This build is its own
// wrapper (Gradle 4.4.1, Java 8 ONLY), never included in settings.gradle.kts,
// no buildSrc, no `everlastingskins.forge-module` convention, no
// dependency-analysis (out-of-band policy, same as forge-1.6.4 /
// forge-1.7.10 / forge-1.8.9 / mc1.12.2).
//
// NAME DOMAINS (empirical, spike-verified against the piston server jar and
// the universal zip):
//   - production runtime = OBFUSCATED. minecraft_server.1.5.2.jar ships
//     proguard names: root-package classes (`dk` = Packet250CustomPayload,
//     `gv` = IServer, ...) EXCEPT identity classes like
//     net/minecraft/server/MinecraftServer which keep their names; members
//     are always obf (MinecraftServer.D() = getServer, MinecraftServer.f =
//     logInfo, Packet250CustomPayload field `a` = channel). FML 5.2 has no
//     deobfuscating remapper in production, so the shipped mod jar MUST be
//     reobfuscated to this domain.
//   - MCP 7.51 conf (bundled in forge-1.5.2-7.8.1.738-src.zip at
//     forge/fml/conf/, version.cfg asserts MCPVersion = 7.51): joined.srg CL
//     lines map obf-class -> srg-class (net/minecraft/src/*); MD lines key by
//     (obf-owner, obf-method, OBF-desc); FD lines key by (obf-owner,
//     obf-field). 7.51 joined.srg has NO #C/#S side tags (0 matches, verified
//     in the spike). methods.csv/fields.csv map func_/field_ -> readable deobf
//     names; the 7.51 CSVs have NO notch column (searge,name,side,desc) — the
//     harness only reads the first two columns, so the shape is a no-op.
//   - THE UNIVERSAL ZIP IS OBF-DOMAIN TOO (single obf->deobf leg for both
//     jars): spike javap of the RAW zip shows
//     `public static net.minecraft.server.MinecraftServer D();` (identity
//     class, obf member) and net/minecraft/server/MinecraftServer.ad member
//     refs. It is actually a JAR (PK header) despite the .zip extension — the
//     naming quirk is REVERSED vs 1.6.4 (there, universal.jar was live and
//     universal.zip 404'd; here universal.zip is live and universal.jar
//     404s). It ALSO carries 4 patched MC classes (patched MinecraftServer,
//     28,191 B vs the vanilla 18,709 B, plus 3 client additions) — the merge
//     step must let universal's patched copies OVERRIDE the server jar's
//     originals (spike MERGE RULE delta).
//   - dev classpath = build/deobf/merged-deobf.jar (server.jar obf->deobf +
//     universal.zip obf->deobf, merged, universal wins collisions). Ship
//     artifact = the mod jar reobf'd deobf->obf (composite: csv reverse +
//     joined.srg reverse).
//
// FML 5.2 surface (vs 7.x on 1.6.4): near-match for this mod's touchpoints —
// `@Mod(modid,name,version)` + `@Mod.EventHandler`, and
// NetworkRegistry.instance().registerChannel(IPacketHandler,String) are the
// SAME API (FML 5.2 NetworkRegistry.java:99-120), so the 1.6.4 adapter's
// programmatic channel path carries over unchanged.

plugins {
    id 'java'
}

version = "${mod_version}"
group = 'levosilimo.everlastingskins'
archivesBaseName = 'everlastingskins-1.5.2'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
    // authlib is NOT on the 1.5.2 server classpath (verified: no authlib in
    // the 1.5.2 server jar / install profile — it arrived in later MC lines)
    // and NOT on mavenCentral; Mojang's own maven hosts it. Needed at
    // compile time because :common's CustomSkinProperty binds authlib's
    // Property type (compile-only; runtime caveat documented above).
    maven {
        name = 'minecraft-libraries'
        url = 'https://libraries.minecraft.net'
    }
}

configurations {
    // SpecialSource 1.7.4 + its transitives (asm-debug-all 5.1, jopt-simple
    // 5.0.1, guava 19.0) — resolved from mavenCentral, hash-verified by
    // Gradle. This is the ONLY toolchain dependency; the buildscript block
    // (and its FG/jitpack/forge-maven repos) is intentionally absent.
    specialsource
}

// Harness output paths (defined before `dependencies` so the lazy
// `compile files(...)` reference can see them).
def mappingDir = file("$buildDir/mappings")
def obfToDeobfSrg = file("$mappingDir/obf-to-deobf.srg")
def deobfToObfSrg = file("$mappingDir/deobf-to-obf.srg")
def deobfServerJar = file("$buildDir/deobf/server-deobf.jar")
def deobfUniversalJar = file("$buildDir/deobf/universal-deobf.jar")
def mergedDeobfJar = file("$buildDir/deobf/merged-deobf.jar")

dependencies {
    specialsource 'net.md-5:SpecialSource:1.7.4'

    // :common is consumed by source-dir sharing and binds three Maven
    // artifacts at compile time that the 1.5.2 server does NOT ship
    // (verified against the server jar listing — authlib and log4j arrived
    // in later MC lines; gson is not bundled either). Rule-4 lane decision:
    // declare them explicitly with the 1.6.4-proven pins (exact 1.5.2-era
    // gson is 2.1 — version refinement is a port-time decision, not a spike
    // concern). Runtime note (documented in the coverage report): a
    // deployment must add authlib + log4j-api jars to the server classpath,
    // since the mod (like every lane) stores :common's authlib-backed
    // CustomSkinProperty.
    compile 'com.google.code.findbugs:jsr305:3.0.2'          // :common @Nullable (not on 1.5.2 classpath)
    compile 'com.google.code.gson:gson:2.2.2'                // :common SkinIO/JsonUtils (1.6.4-proven pin)
    compile 'com.mojang:authlib:1.5.16'                      // :common CustomSkinProperty (hosted on libraries.minecraft.net)
    compile 'org.apache.logging.log4j:log4j-api:2.8.1'       // :common LogManager (not on 1.5.2 classpath)

    // authlib 1.5.16 transitively pulls log4j-core:2.0-beta9, whose
    // Log4jContextFactory does not match log4j-api 2.8.1's interface — the
    // ServiceLoader picks the beta core at TEST runtime and
    // LogManager.getLogger throws AbstractMethodError (23 test failures,
    // 2026-08-09, build #1). Version-match the core at test scope only: no
    // new Maven coordinate (log4j-core is already on the test classpath via
    // authlib), and the ship jar never bundles it.
    testCompile 'org.apache.logging.log4j:log4j-core:2.8.1'  // test-runtime match for log4j-api 2.8.1 (authlib beta conflict)

    // The merged-deobf jar (MC + FML + Forge) is produced by deobfClasspath;
    // `compile files(...)` resolves lazily, after the producing task runs.
    compile files(mergedDeobfJar)

    // Rule 4 lane decision: JUnit 4.13.2 + mockito-core 2.28.2, mirroring
    // forge-1.7.10 / forge-1.6.4 (Gradle 4.4.1 floor; 4.4.1 lanes use JUnit 4).
    testCompile 'junit:junit:4.13.2'
    testCompile 'org.mockito:mockito-core:2.28.2'
}

// :common is consumed by source-dir sharing: this is a standalone build and
// cannot use project(":common"). Classes that also exist under src/main/java
// must be deleted from the lane — javac fails on the duplicate via the share
// (Rule 1; :common is canonical).
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../common/src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir '../common/src/main/resources'
        }
    }
}

// ---------------------------------------------------------------------------
// Vendored inputs (resolveVendored)
// ---------------------------------------------------------------------------
// Cache dir mirrors the forge-1.7.10 jitpack vendor-fallback pattern: files
// land outside the repo (under the Gradle user home) and can be pre-seeded
// for offline builds. Override with -Pvendored.dir=<path>; force offline
// with -Pvendored.offline (fails instead of downloading).
def vendoredDir = project.hasProperty('vendored.dir')
    ? file(project.property('vendored.dir'))
    : file("${gradle.gradleUserHomeDir}/everlastingskins-vendored/1.5.2")

def vendoredInputs = [
    [name: 'forge-1.5.2-7.8.1.738-src.zip',
     url: 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.5.2-7.8.1.738/forge-1.5.2-7.8.1.738-src.zip',
     algo: 'MD5', digest: '82d0c238e13dda7b62d7c9ebb8714866'],
    // NAMING QUIRK (reversed vs 1.6.4): the compiled FML 5.2 + Forge artifact
    // is universal.ZIP (actually a JAR — PK header); universal.jar 404s.
    [name: 'forge-1.5.2-7.8.1.738-universal.zip',
     url: 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.5.2-7.8.1.738/forge-1.5.2-7.8.1.738-universal.zip',
     algo: 'MD5', digest: '8889a0e9fa22a71f4dfa63aab16c495b'],
    [name: 'minecraft_server.1.5.2.jar',
     url: 'https://launcher.mojang.com/v1/objects/f9ae3f651319151ce99a0bfad6b34fa16eb6775f/server.jar',
     algo: 'SHA-1', digest: 'f9ae3f651319151ce99a0bfad6b34fa16eb6775f'],
]

def digestOf = { File f, String algo ->
    def md = java.security.MessageDigest.getInstance(algo)
    f.withInputStream { is ->
        byte[] buf = new byte[8192]
        int n
        while ((n = is.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().collect { String.format('%02x', it) }.join('')
}

task resolveVendored {
    group = 'everlastingskins'
    description = 'Download + checksum-verify the 3 vendored inputs (forge src zip, forge universal zip, vanilla 1.5.2 server jar) into a cache dir; pre-seed the dir or pass -Pvendored.offline for offline builds.'
    outputs.dir vendoredDir
    doLast {
        def offline = project.hasProperty('vendored.offline')
        vendoredInputs.each { input ->
            def target = new File(vendoredDir, input.name)
            if (target.isFile() && digestOf(target, input.algo).equalsIgnoreCase(input.digest)) {
                logger.lifecycle("resolveVendored: ${input.name} present and verified (${input.algo} ${input.digest})")
                return
            }
            if (offline) {
                throw new GradleException("vendored input missing in offline mode: ${target} — pre-seed the cache dir or drop -Pvendored.offline")
            }
            target.parentFile.mkdirs()
            def part = new File(target.parentFile, target.name + '.part')
            logger.lifecycle("resolveVendored: downloading ${input.url}")
            new URL(input.url).withInputStream { is ->
                part.withOutputStream { os -> os << is }
            }
            def actual = digestOf(part, input.algo)
            if (!actual.equalsIgnoreCase(input.digest)) {
                part.delete()
                throw new GradleException("checksum mismatch for ${input.name}: expected ${input.digest}, got ${actual}")
            }
            part.renameTo(target)
            logger.lifecycle("resolveVendored: ${input.name} downloaded and verified (${input.algo} ${input.digest})")
        }
    }
}

// ---------------------------------------------------------------------------
// MCP 7.51 conf extraction (extractMcpConf)
// ---------------------------------------------------------------------------
def mcpConfDir = file("$buildDir/mcp751")

task extractMcpConf(dependsOn: resolveVendored) {
    group = 'everlastingskins'
    description = 'Extract the bundled MCP 7.51 conf (forge/fml/conf/*) from the forge src zip and assert MCPVersion=7.51.'
    inputs.file { new File(vendoredDir, 'forge-1.5.2-7.8.1.738-src.zip') }
    outputs.dir mcpConfDir
    doLast {
        def srcZip = new File(vendoredDir, 'forge-1.5.2-7.8.1.738-src.zip')
        delete mcpConfDir
        ant.unzip(src: srcZip, dest: mcpConfDir) {
            patternset {
                include(name: 'forge/fml/conf/**')
            }
        }
        // Flatten the forge/fml/conf/ nesting so consumers see plain files.
        def nested = new File(mcpConfDir, 'forge/fml/conf')
        if (!nested.isDirectory()) {
            throw new GradleException("extractMcpConf: no forge/fml/conf/ in ${srcZip.name}")
        }
        nested.listFiles().each { f -> f.renameTo(new File(mcpConfDir, f.name)) }
        delete new File(mcpConfDir, 'forge')

        ['joined.srg', 'methods.csv', 'fields.csv', 'params.csv', 'packages.csv', 'version.cfg'].each { name ->
            if (!new File(mcpConfDir, name).isFile()) {
                throw new GradleException("extractMcpConf: missing ${name} after extraction")
            }
        }
        def versionCfg = new File(mcpConfDir, 'version.cfg').getText('UTF-8')
        if (!versionCfg.contains('MCPVersion = 7.51')) {
            throw new GradleException("extractMcpConf: version.cfg does not assert MCPVersion = 7.51:\n${versionCfg}")
        }
        logger.lifecycle('extractMcpConf: MCP 7.51 conf extracted and asserted (MCPVersion = 7.51, 1.5.2)')
    }
}

// ---------------------------------------------------------------------------
// MCP conf parsers (shared by the mapping builders)
// ---------------------------------------------------------------------------
// methods.csv/fields.csv rows: searge,name,side,desc — 7.51 has NO notch
// column (unlike 8.11); the desc column is quoted and may contain commas.
// Only the first two fields are needed.
def parseCsvMappings = { File csv ->
    def map = [:]
    csv.eachLine('UTF-8') { line, idx ->
        if (idx == 0 || line.trim().isEmpty()) return
        int c1 = line.indexOf(',')
        int c2 = line.indexOf(',', c1 + 1)
        if (c1 < 0 || c2 < 0) return
        map[line.substring(0, c1).trim()] = line.substring(c1 + 1, c2).trim()
    }
    map
}

// joined.srg lines (tokens after the ':' separator; 7.51 has NO trailing
// #C/#S side tags — 0 matches verified in the spike — but the tag drop is
// kept for shape parity with 8.11):
//   CL: <obfClass> <srgClass>
//   MD: <obfOwner>/<obfMethod> <OBF-desc> <srgOwner>/<funcName> <srg-desc>
//   FD: <obfOwner>/<obfField> <srgOwner>/<fieldName>
def parseJoinedSrg = { File srg ->
    def cl = [:]      // obf class -> srg class
    def clRev = [:]   // srg class -> obf class
    def md = [:]      // [obfOwner, obfMethod, obfDesc] -> [srgOwner, funcName, srgDesc]
    def fd = [:]      // [obfOwner, obfField] -> [srgOwner, srgField]
    srg.eachLine('UTF-8') { line ->
        line = line.trim()
        if (line.isEmpty() || line.startsWith('#')) return
        def tok = line.split('\\s+').findAll { !it.startsWith('#') }
        if (tok.size() < 3) return
        switch (tok[0]) {
            case 'CL:':
                cl[tok[1]] = tok[2]
                clRev[tok[2]] = tok[1]
                break
            case 'MD:':
                def inOwner = tok[1].substring(0, tok[1].lastIndexOf('/'))
                def inName = tok[1].substring(tok[1].lastIndexOf('/') + 1)
                def outOwner = tok[3].substring(0, tok[3].lastIndexOf('/'))
                def outName = tok[3].substring(tok[3].lastIndexOf('/') + 1)
                md[[inOwner, inName, tok[2]]] = [outOwner, outName, tok[4]]
                break
            case 'FD:':
                def inOwner = tok[1].substring(0, tok[1].lastIndexOf('/'))
                def inName = tok[1].substring(tok[1].lastIndexOf('/') + 1)
                def outOwner = tok[2].substring(0, tok[2].lastIndexOf('/'))
                def outName = tok[2].substring(tok[2].lastIndexOf('/') + 1)
                fd[[inOwner, inName]] = [outOwner, outName]
                break
        }
    }
    [cl: cl, clRev: clRev, md: md, fd: fd]
}

def writeSrgMapping = { File out, Map clMap, Map mdMap, Map fdMap ->
    def w = out.newWriter('UTF-8')
    try {
        clMap.each { k, v -> w.println("CL: ${k} ${v}") }
        mdMap.each { key, value -> w.println("MD: ${key[0]}/${key[1]} ${key[2]} ${value[0]}/${value[1]} ${value[2]}") }
        fdMap.each { key, value -> w.println("FD: ${key[0]}/${key[1]} ${value[0]}/${value[1]}") }
    } finally {
        w.close()
    }
}

// Rewrite every class reference in a descriptor to the obf domain.
def obfifyDesc = { String desc, Map clRev ->
    desc.replaceAll(/L([^;]+);/) { m ->
        def obf = clRev[m[1]]
        obf ? "L${obf};" : m[0]
    }
}

def runSpecialSource = { String inJar, String outJar, String srgIn ->
    javaexec {
        classpath = configurations.specialsource
        main = 'net.md_5.specialsource.SpecialSource'
        args '-i', inJar, '-o', outJar, '-m', srgIn, '-q'
    }
}

// ---------------------------------------------------------------------------
// Subclass-owner expansion (javac receiver-owner shape)
// ---------------------------------------------------------------------------
// javac emits invokevirtual refs with the RECEIVER's static type as owner
// (verified 2026-08-09 with javac 8): `p.getCommandSenderName()` on an
// EntityPlayerMP-typed p produces `Methodref EntityPlayerMP.getCommandSenderName`
// even though the method is DECLARED on EntityPlayer. SpecialSource remaps
// refs by exact (owner,name,desc) match, so a ref on a subclass owner misses
// the MD entry and leaks the readable name into the obf jar with only the
// owner CL-remapped (observed: `jc.getCommandSenderName` in the ship jar — a
// NoSuchMethodError on the obf runtime, where jc declares c_). The spike stub
// never exercised this (its two surfaces — MinecraftServer.getServer and
// Packet250CustomPayload.channel — are declared on their owners); the
// production adapter does. Fix: expand each reverse MD entry to every
// srg-domain subclass of the declaring owner, so subclass-owner refs remap to
// the obf subclass + obf name (jc.c_ — JVM resolution walks jc -> sq and
// finds c_). Fields need no expansion (javac always emits the declaring owner
// for getfield).

// Minimal class-file scan: returns [className -> superClassName] for every
// .class in a jar, from the constant pool (magic/minor/major + cpCount only).
def scanHierarchy = { File jar ->
    def hier = [:]
    new java.util.zip.ZipFile(jar).withCloseable { zf ->
        zf.entries().each { entry ->
            if (!entry.name.endsWith('.class')) return
            byte[] bytes = zf.getInputStream(entry).bytes
            def pos = 8 // magic(4) + minor(2) + major(2)
            def cpCount = ((bytes[pos] & 0xFF) << 8) | (bytes[pos + 1] & 0xFF)
            pos += 2
            def utf8 = [:]
            def classNames = [:]
            def i = 1
            while (i < cpCount) {
                def tag = bytes[pos] & 0xFF
                pos += 1
                switch (tag) {
                    case 1: // CONSTANT_Utf8
                        def len = ((bytes[pos] & 0xFF) << 8) | (bytes[pos + 1] & 0xFF)
                        pos += 2
                        utf8[i] = new String(bytes, pos, len, 'UTF-8')
                        pos += len
                        break
                    case 7: // CONSTANT_Class -> name_index
                        classNames[i] = ((bytes[pos] & 0xFF) << 8) | (bytes[pos + 1] & 0xFF)
                        pos += 2
                        break
                    case 5: case 6: // CONSTANT_Long / Double (2 slots)
                        pos += 8
                        i += 1
                        break
                    case 15: // CONSTANT_MethodHandle
                        pos += 3
                        break
                    case 8: case 16: // CONSTANT_String / MethodType
                        pos += 2
                        break
                    default: // int, float, Fieldref, Methodref, InterfaceMethodref,
                             // NameAndType, Dynamic, InvokeDynamic
                        pos += 4
                        break
                }
                i += 1
            }
            pos += 2 // access_flags
            def thisIdx = ((bytes[pos] & 0xFF) << 8) | (bytes[pos + 1] & 0xFF)
            def superIdx = ((bytes[pos + 2] & 0xFF) << 8) | (bytes[pos + 3] & 0xFF)
            def thisName = utf8[classNames[thisIdx]]
            if (thisName != null) {
                hier[thisName] = superIdx == 0 ? null : utf8[classNames[superIdx]]
            }
        }
    }
    hier
}

// For each reverse MD entry (declaringOwner, readable, srgDesc) ->
// (obfOwner, obfName, obfDesc), add entries for every srg-domain subclass of
// the declaring owner (transitive), with the subclass's obf name as output
// owner. Only srg-domain classes (net/minecraft/src, net/minecraft/server)
// participate — FML classes are never obfuscated and never appear as
// declaring owners in the MD map.
def expandSubclassMethods = { Map mdMapC, Map hier, Map clRevMap ->
    def subclasses = [:]
    hier.each { name, superName ->
        if (superName != null) {
            def list = subclasses.get(superName, [])
            list << name
            subclasses[superName] = list
        }
    }
    def extra = [:]
    mdMapC.each { key, value ->
        def owner = key[0]
        // COPY the subclass list: queue.remove(0) below must not drain the
        // list stored in `subclasses` — a drained list silently starves every
        // later mdMapC entry with the same owner (observed 2026-08-09: only
        // the first EntityPlayer-declared method expanded; getCommandSenderName
        // leaked as jc.getCommandSenderName).
        def queue = new ArrayList(subclasses.get(owner, []) ?: [])
        def seen = [(owner): true]
        while (!queue.isEmpty()) {
            def sub = queue.remove(0)
            if (seen[sub]) continue
            seen[sub] = true
            def obfSub = clRevMap[sub] ?: sub
            extra[[sub, key[1], key[2]]] = [obfSub, value[1], value[2]]
            queue.addAll(new ArrayList(subclasses.get(sub, []) ?: []))
        }
    }
    extra.each { k, v -> mdMapC[k] = v }
}

// ---------------------------------------------------------------------------
// Deobf classpath (deobfClasspath): compose the obf->deobf mapping, run
// SpecialSource on the server jar AND the universal zip (BOTH are
// obf-domain for classes/fields — single obf->deobf leg), merge into
// build/deobf/merged-deobf.jar.
// ---------------------------------------------------------------------------
task deobfClasspath(dependsOn: extractMcpConf) {
    group = 'everlastingskins'
    description = 'Compose the obf->deobf mapping from the MCP 7.51 conf, run SpecialSource on the server jar AND the FML universal zip (both reference MC classes/fields by obf names), and merge them into build/deobf/merged-deobf.jar — the FG "minecraft" classpath equivalent. Universal\'s 4 patched MC classes (patched MinecraftServer + 3 client additions) override the server jar\'s originals in the merge.'
    inputs.dir mcpConfDir
    inputs.files {
        [new File(vendoredDir, 'minecraft_server.1.5.2.jar'),
         new File(vendoredDir, 'forge-1.5.2-7.8.1.738-universal.zip')]
    }
    outputs.files mergedDeobfJar, deobfServerJar, deobfUniversalJar, obfToDeobfSrg, deobfToObfSrg
    doLast {
        def methods = parseCsvMappings(new File(mcpConfDir, 'methods.csv'))
        def fields = parseCsvMappings(new File(mcpConfDir, 'fields.csv'))
        def srg = parseJoinedSrg(new File(mcpConfDir, 'joined.srg'))
        mappingDir.mkdirs()

        // --- obf -> deobf (server jar + universal zip) ------------------
        // Bytecode refs: (obfOwner, obfMethod, OBF-desc) + (obfOwner, obfField).
        // The conf MD input side already carries the OBF desc; the owner is
        // obf (identity classes map to themselves via clRev fallback).
        def clMap = [:]
        def mdMap = [:]
        def fdMap = [:]
        srg.cl.each { obf, srgName -> clMap[obf] = srgName }
        srg.md.each { key, value ->
            def readable = methods[value[1]]
            if (readable == null) return
            def obfOwner = srg.clRev[key[0]] ?: key[0]
            mdMap[[obfOwner, key[1], key[2]]] = [value[0], readable, value[2]]
        }
        srg.fd.each { key, value ->
            def readable = fields[value[1]]
            if (readable == null) return
            fdMap[[key[0], key[1]]] = [value[0], readable] // key = (obfOwner, obfField)
        }
        writeSrgMapping(obfToDeobfSrg, clMap, mdMap, fdMap)

        // --- remap + merge -------------------------------------------------
        new File("$buildDir/deobf").mkdirs()
        runSpecialSource(new File(vendoredDir, 'minecraft_server.1.5.2.jar').absolutePath,
            deobfServerJar.absolutePath, obfToDeobfSrg.absolutePath)
        runSpecialSource(new File(vendoredDir, 'forge-1.5.2-7.8.1.738-universal.zip').absolutePath,
            deobfUniversalJar.absolutePath, obfToDeobfSrg.absolutePath)

        // MERGE RULE (1.5.2 delta vs 1.6.4): the universal zip carries 4
        // patched MC classes (patched MinecraftServer 28,191 B vs vanilla
        // 18,709 B, plus 3 client additions) that collide with the server
        // jar's originals. The first-seen entry wins the dedupe, so the
        // universal jar must be merged FIRST — its patched copies override.
        // Everything else is disjoint by construction (server: net/minecraft
        // + leftover obf classes; universal: cpw.mods.fml + net.minecraftforge
        // + the patched MC classes).
        def seen = new HashSet()
        mergedDeobfJar.withOutputStream { os ->
            def zos = new java.util.zip.ZipOutputStream(os)
            try {
                [deobfUniversalJar, deobfServerJar].each { jar ->
                    new java.util.zip.ZipFile(jar).withCloseable { zf ->
                        zf.entries().each { entry ->
                            if (entry.isDirectory() || !seen.add(entry.name)) return
                            zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            zf.getInputStream(entry).withCloseable { ins -> zos << ins }
                            zos.closeEntry()
                        }
                    }
                }
            } finally {
                zos.close()
            }
        }

        // --- deobf -> obf (mod jar reobf, composite reverse) ------------
        // Bytecode refs after compiling against merged-deobf.jar:
        // (srgOwner, readable, srg-desc) + (srgOwner, readableField).
        // Reverse each conf line through the csvs; identity classes keep
        // their names, so they are excluded from the CL reverse map.
        // Built AFTER the merge: the subclass-owner expansion
        // (expandSubclassMethods) scans the merged jar's hierarchy, which
        // only exists once both legs are remapped and combined.
        def clRevMap = [:]
        srg.clRev.each { srgName, obf -> if (srgName != obf) clRevMap[srgName] = obf }
        def mdMapC = [:]
        def fdMapC = [:]
        srg.md.each { key, value ->
            def readable = methods[value[1]]
            if (readable == null) return
            def obfOwner = clRevMap[value[0]] ?: value[0]
            mdMapC[[value[0], readable, value[2]]] = [obfOwner, key[1], obfifyDesc(value[2], clRevMap)]
        }
        srg.fd.each { key, value ->
            def readable = fields[value[1]]
            if (readable == null) return
            def obfOwner = clRevMap[value[0]] ?: value[0]
            fdMapC[[value[0], readable]] = [obfOwner, key[1]]
        }
        expandSubclassMethods(mdMapC, scanHierarchy(mergedDeobfJar), clRevMap)
        writeSrgMapping(deobfToObfSrg, clRevMap, mdMapC, fdMapC)

        logger.lifecycle("deobfClasspath: ${mergedDeobfJar.name} built (server obf->deobf + universal obf->deobf, universal patched MC wins)")
    }
}

// ---------------------------------------------------------------------------
// Compile (compileJava): javac against merged-deobf.jar + declared deps.
// ---------------------------------------------------------------------------
compileJava {
    dependsOn deobfClasspath
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------------------
// @Mod version constant (generateVersionSource)
// ---------------------------------------------------------------------------
// The @Mod annotation needs a compile-time version constant; without FG's
// `replace` token, a generated source keeps @Mod's version in sync with
// gradle.properties mod_version (mcmod.info is expanded separately in
// processResources).
def versionSourceDir = file("$buildDir/generated/version")

task generateVersionSource {
    group = 'everlastingskins'
    description = 'Generate ModVersion.VERSION from gradle.properties mod_version (no FG replace on this harness).'
    outputs.dir versionSourceDir
    doLast {
        def f = new File(versionSourceDir, 'levosilimo/everlastingskins/forge152/ModVersion.java')
        f.parentFile.mkdirs()
        f.text = """package levosilimo.everlastingskins.forge152;

/** Generated from gradle.properties mod_version — keeps @Mod's version in sync. */
public final class ModVersion {
    public static final String VERSION = "${project.version}";

    private ModVersion() {}
}
"""
    }
}

sourceSets.main.java.srcDir versionSourceDir
compileJava.dependsOn generateVersionSource

jar {
    manifest {
        attributes([
            'Specification-Title': archivesBaseName,
            'Specification-Vendor': 'Levosilimo',
            'Specification-Version': project.version,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Levosilimo'
        ])
    }
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': "${minecraft_version}"
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// ---------------------------------------------------------------------------
// Reobf (reobf): composite deobf->obf remap of the mod jar, in place.
// ---------------------------------------------------------------------------
task reobf(dependsOn: [jar, deobfClasspath]) {
    group = 'everlastingskins'
    description = 'Reobfuscate the mod jar deobf->obf (csv reverse + joined.srg reverse) with SpecialSource — production runs obfuscated, so the ship artifact must be obf-named.'
    inputs.file jar.archivePath
    inputs.file deobfToObfSrg
    outputs.file jar.archivePath
    doLast {
        def inJar = jar.archivePath
        def tmpJar = file("${inJar.parentFile}/${inJar.name}.reobf")
        runSpecialSource(inJar.absolutePath, tmpJar.absolutePath, deobfToObfSrg.absolutePath)
        if (!inJar.delete()) throw new GradleException("reobf: could not delete ${inJar}")
        if (!tmpJar.renameTo(inJar)) throw new GradleException("reobf: could not replace ${inJar} with the reobf'd jar")
        logger.lifecycle("reobf: ${inJar.name} remapped deobf->obf")
    }
}

// ---------------------------------------------------------------------------
// Self-check (assertNameDomain): javap the reobf'd mod jar and fail on any
// leaked srg/deobf MC reference.
// ---------------------------------------------------------------------------
task assertNameDomain(dependsOn: reobf) {
    group = 'verification'
    description = 'Self-check: javap the reobf\'d mod jar and fail if any MC reference is still srg/deobf-named. Forbidden tokens are scoped to the srg domain (func_, field_, net/minecraft/src/) plus the lane\'s known MC member surfaces. Two owner-qualified tokens cover declared-on-owner refs (MinecraftServer.getServer -> D, Packet250CustomPayload.channel -> dk.a); the bare member-name tokens (getCommandSenderName, getConfigurationManager, getFile, playerNetServerHandler, netManager, playerEntityList) cover the javac receiver-owner shape — a readable MC member name on ANY owner (deobf or obf) in the shipped jar is a leaked reobf, and none of these names is used by the mod\'s own classes or the FML API, so they cannot false-positive. FML API refs like FMLServerStartingEvent.getServer() legitimately stay readable and are NOT flagged (owner-qualified token).'
    doLast {
        def jarFile = jar.archivePath
        def classes = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zf ->
            zf.entries().each { e ->
                if (e.name.endsWith('.class') && !e.name.startsWith('META-INF/')) {
                    classes << e.name.substring(0, e.name.length() - 6).replace('/', '.')
                }
            }
        }
        if (classes.isEmpty()) throw new GradleException("assertNameDomain: no classes in ${jarFile}")

        def javapBin = new File(System.getProperty('java.home'), 'bin/javap')
        if (!javapBin.isFile()) javapBin = new File(System.getProperty('java.home'), '../bin/javap')
        if (!javapBin.isFile()) throw new GradleException("assertNameDomain: javap not found (${javapBin})")

        def out = new ByteArrayOutputStream()
        def javapArgs = [javapBin.absolutePath, '-c', '-p', '-classpath', jarFile.absolutePath] + classes
        exec {
            commandLine javapArgs
            standardOutput = out
            errorOutput = out
        }
        def text = out.toString('UTF-8')

        // Leaked-domain tokens. net/minecraft/src/ is the renamed-class srg
        // package (any such ref is a missed CL remap); func_/field_ are srg
        // member names; the owner-qualified MC member surfaces must be obf
        // after reobf (MinecraftServer.getServer -> D, Packet250CustomPayload
        // .channel -> dk.a). The bare member-name tokens catch the javac
        // receiver-owner leak shape (readable name on an obf owner, e.g.
        // jc.getCommandSenderName after a missed inherited-method remap).
        // FML API names (getServer, registerChannel) are never obfuscated and
        // are excluded by the owner qualification / not being in the list.
        def forbidden = ['func_', 'field_', 'net/minecraft/src/',
                         'net/minecraft/server/MinecraftServer.getServer',
                         'Packet250CustomPayload.channel',
                         'getCommandSenderName',
                         'getConfigurationManager',
                         'net/minecraft/server/MinecraftServer.getFile',
                         'playerNetServerHandler',
                         'netManager',
                         'playerEntityList']
        def offenders = forbidden.findAll { text.contains(it) }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                "assertNameDomain FAILED: leaked srg/deobf references in ${jarFile.name}: ${offenders.join(', ')}\n" +
                "The deobf->obf reobf chain did not fully remap the MC surface (see deobf-to-obf.srg)."
            )
        }
        logger.lifecycle("assertNameDomain: ${jarFile.name} is fully obf-named (no func_, field_, or net/minecraft/src/ refs)")
    }
}

// ---------------------------------------------------------------------------
// no-mixin gate (inlined from buildSrc no-mixin.gradle.kts via the
// forge-1.7.10/build.gradle:135-209 template, which this standalone build
// cannot reference)
// ---------------------------------------------------------------------------
def bannedLiterals = [
    [label: 'mixingradle coordinate', literal: 'org.spongepowered' + ':mixingradle'],
    [label: 'mixin plugin id', literal: 'org.spongepowered' + '.mixin'],
    [label: 'mixin config bundling', literal: 'everlastingskins' + '.mixins.json'],
]

def bannedPatterns = [
    [label: 'Mixin annotation', pattern: java.util.regex.Pattern.compile('@' + 'Mixin' + '\\b')],
    [label: 'mixin block', pattern: java.util.regex.Pattern.compile('^\\s*' + 'mixin' + '\\s*\\{')],
]

def scanFile = { File file, List<String> offenders ->
    if (!file.isFile()) return
    def text = file.getText('UTF-8')
    bannedLiterals.each { entry ->
        if (text.contains(entry.literal)) {
            offenders << "${project.relativePath(file)}: ${entry.label} reference ('${entry.literal}')"
        }
    }
    bannedPatterns.each { entry ->
        def matcher = entry.pattern.matcher(text)
        while (matcher.find()) {
            def lineNo = text.substring(0, matcher.start()).count('\n') + 1
            offenders << "${project.relativePath(file)}: ${entry.label} at line ${lineNo}"
        }
    }
}

task verifyNoMixin {
    group = 'verification'
    description = 'Fails the build if any Mixin usage is detected: annotations, mixingradle, the mixin plugin id, mixin {} blocks, or mixins.json bundling.'

    doLast {
        def offenders = []

        def sourceRoots = []
        sourceSets.each { ss ->
            ss.allSource.srcDirs.each { dir ->
                if (dir.exists()) sourceRoots << dir
            }
        }
        sourceRoots.each { root ->
            root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name.endsWith('.java') || f.name.endsWith('.json') || f.name.endsWith('.properties')) {
                    scanFile(f, offenders)
                }
            }
        }

        ['build.gradle', 'settings.gradle', 'gradle.properties'].each { name ->
            def f = new File(projectDir, name)
            if (f.isFile()) scanFile(f, offenders)
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                "Mixin policy violated:\n" +
                offenders.join('\n') +
                "\n\nMixin policy: the lane contains ZERO Mixin usage. " +
                "If a lane requires Mixin support, fork the lane - it is a sign " +
                "that should not happen in the shared core."
            )
        }
        logger.lifecycle('Mixin check passed: zero Mixin annotations, zero mixingradle references.')
    }
}

test {
    testLogging {
        events "passed", "skipped", "failed"
    }
}

build.dependsOn verifyNoMixin, assertNameDomain
